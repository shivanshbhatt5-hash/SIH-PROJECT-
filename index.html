                      const isActive = selectedCategory === cat.id;
                      return (
                        <button
                          key={cat.id}
                          onClick={() => setSelectedCategory(cat.id)}
                          className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border flex items-center space-x-2 ${
                            isActive
                              ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white border-emerald-400 shadow-md shadow-emerald-600/30'
                              : 'bg-slate-900 text-slate-300 hover:text-white hover:bg-slate-800 border-slate-800'
                          }`}
                        >
                          <span>{cat.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Industry Sector Filter & Search Bar */}
                <div className="glass-panel rounded-2xl p-5 border border-emerald-500/30 bg-slate-900/90 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                    
                    {/* Industry Sector Dropdown (7 cols) */}
                    <div className="md:col-span-6 space-y-1.5">
                      <label className="text-xs font-extrabold text-emerald-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <Icons.Building className="w-3.5 h-3.5 text-emerald-400" />
                        <span>Filter by Your Industry Type / Manufacturing Sector:</span>
                      </label>
                      <select
                        value={selectedIndustrySector}
                        onChange={(e) => setSelectedIndustrySector(e.target.value)}
                        className="glass-input w-full p-2.5 rounded-xl text-xs font-bold text-white border border-emerald-500/30 focus:border-emerald-400 bg-slate-900"
                      >
                        {industrySectorsList.map(sector => (
                          <option key={sector.id} value={sector.id} className="bg-slate-900 text-slate-100">
                            {sector.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Live Search Input (6 cols) */}
                    <div className="md:col-span-6 space-y-1.5">
                      <label className="text-xs font-extrabold text-indigo-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <Icons.Search className="w-3.5 h-3.5 text-indigo-400" />
                        <span>Instant Search by Scheme Name or Benefit Keyword:</span>
                      </label>
                      <div className="relative">
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="e.g. SGST subsidy, CMEGP, battery, seed money, award, stamp duty..."
                          className="glass-input w-full p-2.5 pl-9 rounded-xl text-xs text-white placeholder-slate-500 border border-indigo-500/30 focus:border-indigo-400 bg-slate-900"
                        />
                        <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
                        {searchQuery && (
                          <button
                            onClick={() => setSearchQuery('')}
                            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs"
                          >
                            Clear
                          </button>
                        )}
                      </div>
                    </div>

                  </div>

                  {/* Active Filters Summary Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800 text-xs text-slate-400">
                    <div className="flex items-center space-x-2">
                      <span>Showing <strong className="text-emerald-300 font-mono font-bold">{filteredSchemes.length}</strong> matching schemes</span>
                      {selectedCategory !== 'ALL' && (
                        <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500/30 text-[10px] font-medium">
                          {selectedCategory}
                        </span>
                      )}
                      {selectedIndustrySector !== 'ALL' && (
                        <span className="px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-500/30 text-[10px] font-medium">
                          Sector: {selectedIndustrySector}
                        </span>
                      )}
                    </div>
                    {(selectedCategory !== 'ALL' || selectedIndustrySector !== 'ALL' || searchQuery) && (
                      <button
                        onClick={() => {
                          setSelectedCategory('ALL');
                          setSelectedIndustrySector('ALL');
                          setSearchQuery('');
                        }}
                        className="text-indigo-400 hover:text-indigo-300 font-bold hover:underline"
                      >
                        Reset All Filters
                      </button>
                    )}
                  </div>
                </div>

                {/* Schemes Cards Grid */}
                {filteredSchemes.length > 0 ? (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {filteredSchemes.map((scheme) => (
                      <div
                        key={scheme.id}
                        className="glass-card rounded-2xl p-6 border border-slate-800 hover:border-emerald-500/40 transition-all flex flex-col justify-between space-y-5 bg-gradient-to-br from-slate-900/90 via-slate-900/60 to-slate-950 shadow-lg"
                      >
                        <div className="space-y-4">
                          
                          {/* Card Header: Category & Type Badge */}
                          <div className="flex items-start justify-between gap-3 border-b border-slate-800 pb-3">
                            <div className="space-y-1">
                              <span className="text-[10px] font-mono font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 inline-block">
                                {scheme.categoryShort}
                              </span>
                              <h3 className="text-base sm:text-lg font-black text-white leading-snug">
                                {scheme.name}
                              </h3>
                            </div>
                            <span className="px-2.5 py-1 rounded-lg text-[10px] font-bold font-mono uppercase shrink-0 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                              {scheme.type}
                            </span>
                          </div>

                          {/* Industry Sector Tags */}
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[10px] text-slate-400 font-bold uppercase mr-1">Industry Sectors:</span>
                            {scheme.industryTypes.slice(0, 3).map((ind, iIdx) => (
                              <span
                                key={iIdx}
                                className="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-300 border border-slate-700"
                              >
                                {ind}
                              </span>
                            ))}
                            {scheme.industryTypes.length > 3 && (
                              <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-indigo-300 border border-indigo-500/30">
                                +{scheme.industryTypes.length - 3} more
                              </span>
                            )}
                          </div>

                          {/* Scheme Summary Statement (exact from user requirements) */}
                          <p className="text-xs text-slate-300 bg-slate-950/60 p-3 rounded-xl border border-slate-800 leading-relaxed">
                            <strong className="text-emerald-400 font-bold mr-1">Policy Scope:</strong>
                            {scheme.summary}
                          </p>

                          {/* Key Benefits Grid (4 Benefit Highlight Blocks) */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                            {scheme.benefits.map((ben, bIdx) => (
                              <div
                                key={bIdx}
                                className="p-2.5 rounded-xl bg-slate-900/90 border border-slate-800 flex items-start space-x-2.5"
                              >
                                <div className="w-7 h-7 rounded-lg bg-emerald-500/15 text-emerald-400 flex items-center justify-center shrink-0 border border-emerald-500/30">
                                  <Icons.Sparkles className="w-3.5 h-3.5" />
                                </div>
                                <div className="min-w-0">
                                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">
                                    {ben.label}
                                  </span>
                                  <span className="text-xs font-semibold text-slate-200 leading-tight block">
                                    {ben.value}
                                  </span>
                                </div>
                              </div>
                            ))}
                          </div>

                          {/* Nodal Agency & Validity */}
                          <div className="flex items-center justify-between text-[11px] text-slate-400 pt-1">
                            <span className="truncate">Nodal: <strong className="text-slate-300">{scheme.nodalAgency}</strong></span>
                            <span className="shrink-0 font-mono text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">{scheme.validity}</span>
                          </div>

                        </div>

                        {/* Action Buttons: View Details & Apply Online */}
                        <div className="pt-3 border-t border-slate-800/90 flex items-center gap-3">
                          <button
                            onClick={() => setDetailModalScheme(scheme)}
                            className="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-all flex items-center justify-center space-x-1.5"
                          >
                            <Icons.Eye className="w-3.5 h-3.5 text-indigo-400" />
                            <span>View Guidelines & Eligibility</span>
                          </button>

                          <button
                            onClick={() => {
                              setApplyModalScheme(scheme);
                              setApplyForm(prev => ({
                                ...prev,
                                sector: scheme.industryTypes[0] || 'General Manufacturing'
                              }));
                            }}
                            className="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-md shadow-emerald-600/25 transition-all flex items-center justify-center space-x-1.5"
                          >
                            <Icons.Award className="w-3.5 h-3.5" />
                            <span>Apply for Scheme</span>
                          </button>
                        </div>

                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="glass-panel rounded-2xl p-12 text-center space-y-3 border border-slate-800">
                    <Icons.AlertCircle className="w-10 h-10 text-amber-400 mx-auto" />
                    <h3 className="text-base font-bold text-white">No Schemes Found Matching Filters</h3>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">
                      Try broadening your search term or switching to "All Categories" and "All Industry Sectors".
                    </p>
                    <button
                      onClick={() => {
                        setSelectedCategory('ALL');
                        setSelectedIndustrySector('ALL');
                        setSearchQuery('');
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                    >
                      Clear All Filters
                    </button>
                  </div>
                )}

              </div>
            )}

            {/* ========================================================================= */}
            {/* SUB-TAB 2: INTERACTIVE SUBSIDY & INCENTIVE ESTIMATOR                     */}
            {/* ========================================================================= */}
            {activeSubTab === 'CALCULATOR' && (
              <div className="space-y-6 animate-fade-in">
                
                <div className="glass-panel rounded-2xl p-6 md:p-8 border border-indigo-500/30 bg-gradient-to-br from-slate-900 via-indigo-950/20 to-slate-900 space-y-6">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                      Fiscal Benefit Forecaster
                    </span>
                    <h2 className="text-xl md:text-2xl font-black text-white mt-1.5">
                      Maharashtra Industrial Subsidy & Incentive Calculator (PSI 2019 Engine)
                    </h2>
                    <p className="text-xs text-slate-300 mt-1 max-w-3xl">
                      Simulate your enterprise's eligible capital subsidy, SGST reimbursement, electricity tariff relief, and stamp duty waivers based on Taluka Regional Classification and proposed plant investment.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    
                    {/* Input 1: Sector */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300 uppercase">1. Industry Sector:</label>
                      <select
                        value={calcSector}
                        onChange={(e) => setCalcSector(e.target.value)}
                        className="glass-input w-full p-2.5 rounded-xl text-xs font-bold text-white border border-indigo-500/30 bg-slate-900"
                      >
                        {industrySectorsList.filter(s => s.id !== 'ALL').map(s => (
                          <option key={s.id} value={s.id} className="bg-slate-900 text-slate-100">{s.label}</option>
                        ))}
                      </select>
                    </div>

                    {/* Input 2: Investment in Plant & Machinery */}
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-bold text-slate-300 uppercase">2. Fixed Capital (FCI):</label>
                        <span className="text-xs font-mono font-bold text-indigo-300">₹{calcInvestment} Lakhs</span>
                      </div>
                      <input
                        type="range"
                        min="10"
                        max="5000"
                        step="10"
                        value={calcInvestment}
                        onChange={(e) => setCalcInvestment(Number(e.target.value))}
                        className="w-full accent-indigo-500 cursor-pointer"
                      />
                      <span className="text-[10px] text-slate-400 block text-right">₹0.1 Cr to ₹50 Cr</span>
                    </div>

                    {/* Input 3: Taluka Zone */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300 uppercase">3. Taluka Classification:</label>
                      <select
                        value={calcZone}
                        onChange={(e) => setCalcZone(e.target.value)}
                        className="glass-input w-full p-2.5 rounded-xl text-xs font-bold text-white border border-indigo-500/30 bg-slate-900"
                      >
                        <option value="Zone A" className="bg-slate-900 text-slate-100">Zone A (Developed - MMR / Pune City)</option>
                        <option value="Zone B" className="bg-slate-900 text-slate-100">Zone B (Semi-developed - Kolhapur / Nashik)</option>
                        <option value="Zone C" className="bg-slate-900 text-slate-100">Zone C (Developing Belts)</option>
                        <option value="Zone D" className="bg-slate-900 text-slate-100">Zone D (Backward Districts)</option>
                        <option value="Zone D+ & Aspirational" className="bg-slate-900 text-slate-100">Zone D+ / Naxal / Aspirational (Max Subsidies)</option>
                      </select>
                    </div>

                    {/* Input 4: Social / Entrepreneur Category */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300 uppercase">4. Promoter Category:</label>
                      <select
                        value={calcSocial}
                        onChange={(e) => setCalcSocial(e.target.value)}
                        className="glass-input w-full p-2.5 rounded-xl text-xs font-bold text-white border border-indigo-500/30 bg-slate-900"
                      >
                        <option value="General" className="bg-slate-900 text-slate-100">General Category</option>
                        <option value="SC/ST" className="bg-slate-900 text-slate-100">SC / ST Entrepreneur (Ambedkar Scheme)</option>
                        <option value="Women" className="bg-slate-900 text-slate-100">Women Entrepreneur (Special PMEGP/CMEGP)</option>
                      </select>
                    </div>

                  </div>

                  {/* Calculated Results Showcase Cards */}
                  <div className="pt-4 border-t border-slate-800">
                    <span className="text-xs font-extrabold text-emerald-400 uppercase tracking-wider block mb-3">
                      Estimated Financial Incentives & Subsidies Under PSI 2019 & State Policies:
                    </span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      
                      <div className="p-4 rounded-2xl bg-slate-950/80 border border-emerald-500/30 space-y-1">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">SGST Reimbursement Rate</span>
                        <div className="text-2xl font-black text-emerald-400 font-mono">{calcResults.sgstPct}%</div>
                        <span className="text-xs font-semibold text-slate-300 block">Est. ₹{calcResults.sgstTotal} Lakhs</span>
                        <span className="text-[10px] text-slate-400 block">Reimbursed over 7-year cycle</span>
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-950/80 border border-amber-500/30 space-y-1">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">Power Tariff Subsidy</span>
                        <div className="text-2xl font-black text-amber-400 font-mono">₹{calcResults.powerRate}/u</div>
                        <span className="text-xs font-semibold text-slate-300 block">Est. ₹{calcResults.powerTotal} Lakhs</span>
                        <span className="text-[10px] text-slate-400 block">Direct MSEDCL power bill credit</span>
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-950/80 border border-cyan-500/30 space-y-1">
                        <span className="text-[10px] font-bold text-slate-400 uppercase">Stamp Duty & Reg. Waiver</span>
                        <div className="text-2xl font-black text-cyan-400 font-mono">100%</div>
                        <span className="text-xs font-semibold text-slate-300 block">Est. ₹{calcResults.stampDutyTotal} Lakhs</span>
                        <span className="text-[10px] text-slate-400 block">Waiver on lease & mortgage deeds</span>
                      </div>

                      <div className="p-4 rounded-2xl bg-gradient-to-br from-indigo-900/60 to-purple-900/60 border border-indigo-400/50 space-y-1">
                        <span className="text-[10px] font-extrabold text-indigo-300 uppercase">Total Estimated Fiscal Benefit</span>
                        <div className="text-2xl font-black text-white font-mono">₹{calcResults.totalBenefit} L</div>
                        <span className="text-xs font-semibold text-indigo-200 block">Comprehensive State Package</span>
                        <span className="text-[10px] text-indigo-300/80 block">Direct fiscal cashflow benefit</span>
                      </div>

                    </div>
                  </div>

                  {/* Recommended Schemes for This Profile */}
                  <div className="pt-2">
                    <span className="text-xs font-extrabold text-slate-300 uppercase tracking-wider block mb-2">
                      Direct Applicable Schemes Matching This Calculation:
                    </span>
                    <div className="flex flex-wrap gap-2">
                      <span className="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center space-x-1.5">
                        <Icons.CheckCircle2 className="w-3.5 h-3.5" />
                        <span>Package Scheme of Incentives (PSI) 2019</span>
                      </span>
                      {calcSocial === 'SC/ST' && (
                        <span className="px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30 flex items-center space-x-1.5">
                          <Icons.Sparkles className="w-3.5 h-3.5" />
                          <span>Dr. Babasaheb Ambedkar Special Package (SC/ST)</span>
                        </span>
                      )}
                      {calcInvestment <= 50 && (
                        <span className="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 flex items-center space-x-1.5">
                          <Icons.Award className="w-3.5 h-3.5" />
                          <span>Chief Minister&apos;s Employment Generation Programme (CMEGP)</span>
                        </span>
                      )}
                      {calcSector === 'Automotive & EV' && (
                        <span className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 flex items-center space-x-1.5">
                          <Icons.Zap className="w-3.5 h-3.5" />
                          <span>Electric Vehicle (EV) Policy 2021-2026</span>
                        </span>
                      )}
                      {calcSector === 'Electronics & ESDM' && (
                        <span className="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center space-x-1.5">
                          <Icons.Cpu className="w-3.5 h-3.5" />
                          <span>ESDM Policy & Electronics Cluster Grants</span>
                        </span>
                      )}
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* ========================================================================= */}
            {/* SUB-TAB 3: REGIONAL STATUTORY CLEARANCES DOSSIER (ORIGINAL MASTER CHECKLIST) */}
            {/* ========================================================================= */}
            {activeSubTab === 'STATUTORY_DOSSIER' && (
              <div className="space-y-6 animate-fade-in">
                
                {/* Location & Industry Interactive Filter Bar */}
                <div className="glass-panel rounded-2xl p-6 border border-emerald-500/30 space-y-5 bg-gradient-to-r from-slate-900 via-emerald-950/20 to-slate-900">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                    <div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        Official Scrutiny Directive
                      </span>
                      <h2 className="text-xl font-black text-white mt-1">
                        Select Regional Place (District / Estate) & Industry Type
                      </h2>
                      <p className="text-xs text-slate-300 mt-0.5">
                        Inspect mandatory statutory clearances, physical inspection checkpoints, and legal requirements mandated by the Government of Maharashtra for this specific industrial location.
                      </p>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => window.print()}
                        className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 flex items-center space-x-1.5"
                      >
                        <Icons.Printer className="w-4 h-4 text-emerald-400" />
                        <span>Print Dossier</span>
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {/* Place / District Selector */}
                    <div className="space-y-2">
                      <label className="text-xs font-extrabold text-emerald-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <Icons.MapPin className="w-4 h-4 text-emerald-400" />
                        <span>1. Select Location / District & MIDC Industrial Estate:</span>
                      </label>
                      <select
                        value={selectedLocationId}
                        onChange={(e) => setSelectedLocationId(e.target.value)}
                        className="glass-input w-full p-3 rounded-xl text-xs font-bold text-white border border-emerald-500/30 focus:border-emerald-400 bg-slate-900"
                      >
                        {MAHARASHTRA_LOCATIONS.map(loc => (
                          <option key={loc.id} value={loc.id} className="bg-slate-900 text-slate-100">
                            📍 {loc.name} ({loc.district})
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Industry Type Selector */}
                    <div className="space-y-2">
                      <label className="text-xs font-extrabold text-emerald-300 uppercase tracking-wider flex items-center space-x-1.5">
                        <Icons.Building className="w-4 h-4 text-emerald-400" />
                        <span>2. Select Industry Type & Pollution Category:</span>
                      </label>
                      <select
                        value={selectedIndustryId}
                        onChange={(e) => setSelectedIndustryId(e.target.value)}
                        className="glass-input w-full p-3 rounded-xl text-xs font-bold text-white border border-emerald-500/30 focus:border-emerald-400 bg-slate-900"
                      >
                        {GOVT_INDUSTRY_MANDATES.map(ind => (
                          <option key={ind.id} value={ind.id} className="bg-slate-900 text-slate-100">
                            {ind.icon} {ind.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Regional Geographical & Environmental Profile */}
                  <div className="p-4 rounded-xl bg-slate-950/70 border border-slate-800 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2.5">
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-bold text-slate-300">Jurisdiction:</span>
                        <span className="text-xs font-black text-emerald-300 font-mono">{currentLocation.name}</span>
                        <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                          {currentLocation.regionalZone}
                        </span>
                      </div>
                      <span className="text-[11px] text-slate-400 font-mono">
                        Nodal Office: <strong className="text-slate-200">{currentLocation.nodalOffice}</strong>
                      </span>
                    </div>

                    <div>
                      <span className="text-[11px] font-bold text-amber-300 block uppercase tracking-wider mb-1.5 flex items-center space-x-1.5">
                        <Icons.AlertCircle className="w-3.5 h-3.5 text-amber-400" />
                        <span>Location-Specific Government Regulatory Conditions & Zoning Buffers:</span>
                      </span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {currentLocation.specialConditions.map((cond, cIdx) => (
                          <div key={cIdx} className="flex items-start space-x-2 text-xs text-slate-300 bg-slate-900/60 p-2 rounded-lg border border-slate-800/80">
                            <span className="text-amber-400 font-black">•</span>
                            <span className="leading-snug">{cond}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Department Filter Pills */}
                  <div className="flex items-center gap-1.5 overflow-x-auto pt-1 scrollbar-none">
                    <span className="text-xs font-bold text-slate-400 shrink-0 mr-1">Filter Authority:</span>
                    {['ALL', 'MIDC', 'MPCB', 'PESO', 'Fire', 'DISH', 'MSEDCL', 'Boilers', 'FSSAI', 'FDA'].map(dept => (
                      <button
                        key={dept}
                        onClick={() => setSelectedDeptFilter(dept)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all border ${
                          selectedDeptFilter === dept
                            ? 'bg-emerald-600 text-white border-emerald-400'
                            : 'bg-slate-900 text-slate-400 hover:text-slate-200 border-slate-800'
                        }`}
                      >
                        {dept}
                      </button>
                    ))}
                  </div>

                </div>

                {/* Major Documents Required by the Government: Cards Grid */}
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-lg font-black text-white flex items-center space-x-2">
                        <span>📑</span>
                        <span>All Major & Critical Documents Required by Government for {currentIndustry.name}</span>
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Statutory files, engineering blueprints, and safety audits required by state authorities for legal establishment & commercial commissioning in {currentLocation.district}.
                      </p>
                    </div>
                    <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      {filteredMandates.length} Statutory Clearances
                    </span>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {filteredMandates.map((mandate, mIdx) => (
                      <div
                        key={mIdx}
                        className="glass-card rounded-2xl p-6 border border-slate-800 hover:border-emerald-500/40 transition-all flex flex-col justify-between space-y-5 bg-gradient-to-br from-slate-900/90 via-slate-900/50 to-slate-950"
                      >
                        <div className="space-y-4">
                          {/* Authority & RTS SLA Header */}
                          <div className="flex items-start justify-between border-b border-slate-800 pb-3 gap-3">
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                                  {mandate.authority}
                                </span>
                                <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-500/30">
                                  ⏱️ RTS SLA: {mandate.slaDays} Days
                                </span>
                              </div>
                              <h4 className="text-base font-extrabold text-white mt-1.5 leading-snug">
                                {mandate.title}
                              </h4>
                            </div>
                            <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase font-mono bg-purple-500/20 text-purple-300 border border-purple-500/30 shrink-0">
                              {mandate.stage}
                            </span>
                          </div>

                          {/* Mandatory Statutory Act Reference */}
                          <div className="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/80 flex items-center justify-between text-xs">
                            <span className="text-slate-400">Statutory Mandate Act:</span>
                            <span className="font-mono text-emerald-300 font-bold">{mandate.statutoryAct}</span>
                          </div>

                          {/* Critical Document Checklist */}
                          <div className="space-y-2">
                            <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                              <Icons.FileCheck className="w-3.5 h-3.5 text-emerald-400" />
                              <span>Mandatory Upload Checklist ({mandate.requiredDocuments.length} Documents):</span>
                            </span>
                            <div className="space-y-1.5">
                              {mandate.requiredDocuments.map((doc, dIdx) => {
                                const docKey = `${mIdx}_${dIdx}`;
                                const isChecked = !!checkedMandateDocs[docKey];
                                return (
                                  <div
                                    key={dIdx}
                                    onClick={() => toggleDocCheck(docKey)}
                                    className={`p-2 rounded-lg border text-xs flex items-start space-x-2.5 cursor-pointer transition-all ${
                                      isChecked
                                        ? 'bg-emerald-950/30 border-emerald-500/50 text-emerald-200'
                                        : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:border-slate-700'
                                    }`}
                                  >
                                    <input
                                      type="checkbox"
                                      checked={isChecked}
                                      onChange={() => {}}
                                      className="mt-0.5 rounded text-emerald-600 focus:ring-emerald-500 h-3.5 w-3.5 cursor-pointer bg-slate-800 border-slate-700"
                                    />
                                    <span className="leading-snug">{doc}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* Officer Physical Inspection Checklist */}
                          <div className="p-3 rounded-xl bg-amber-950/20 border border-amber-500/30 space-y-1.5">
                            <span className="text-[11px] font-bold text-amber-300 flex items-center space-x-1.5 uppercase tracking-wider">
                              <Icons.ShieldCheck className="w-3.5 h-3.5 text-amber-400" />
                              <span>Mandatory On-Site Inspection Directives:</span>
                            </span>
                            <ul className="text-xs text-slate-300 space-y-1 pl-1">
                              {mandate.inspectionCheckpoints.map((chk, cIdx) => (
                                <li key={cIdx} className="flex items-start space-x-2">
                                  <span className="text-amber-400 font-bold">•</span>
                                  <span className="leading-snug">{chk}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                        </div>

                        {/* Card Bottom Meta */}
                        <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                          <span>Department: <strong className="text-slate-200">{mandate.authority}</strong></span>
                          <span className="font-mono text-emerald-400 font-bold">RTS Deemed Approval Applicable</span>
                        </div>

                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* ========================================================================= */}
            {/* SUB-TAB 4: INCOMING APPLICATION SCRUTINY QUEUE (ORIGINAL WORKBENCH)       */}
            {/* ========================================================================= */}
            {activeSubTab === 'QUEUE' && (
              <div className="space-y-6 animate-fade-in">
                
                {/* Search & Filter Bar */}
                <div className="glass-panel rounded-2xl p-6 border border-slate-800 space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    
                    {/* Search Input */}
                    <div className="relative flex-1">
                      <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        placeholder="Search application by ID, enterprise name, project title, or statutory NOC type..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="glass-input w-full pl-10 pr-4 py-2.5 rounded-xl text-xs placeholder-slate-500 font-medium"
                      />
                    </div>

                    {/* Status Filter Buttons */}
                    <div className="flex items-center space-x-2 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
                      {['ALL', 'IN_REVIEW', 'ACTION_REQUIRED', 'APPROVED'].map((st) => (
                        <button
                          key={st}
                          onClick={() => setStatusFilter(st)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                            statusFilter === st
                              ? 'bg-emerald-600 text-white shadow-md'
                              : 'bg-slate-800/80 text-slate-300 hover:bg-slate-800'
                          }`}
                        >
                          {st === 'ALL' ? 'All Applications' : st.replace('_', ' ')}
                        </button>
                      ))}
                    </div>

                  </div>
                </div>

                {/* Queue Table */}
                <div className="glass-panel rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-900/80 text-slate-400 uppercase font-mono text-[11px] border-b border-slate-800">
                        <tr>
                          <th className="py-3.5 px-4 font-bold">App ID</th>
                          <th className="py-3.5 px-4 font-bold">Enterprise & Project</th>
                          <th className="py-3.5 px-4 font-bold">Statutory Clearance</th>
                          <th className="py-3.5 px-4 font-bold">Authority</th>
                          <th className="py-3.5 px-4 font-bold">RTS SLA Target</th>
                          <th className="py-3.5 px-4 font-bold text-center">Status</th>
                          <th className="py-3.5 px-4 font-bold text-right">Officer Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-body">
                        {filteredApps.length > 0 ? (
                          filteredApps.map((app) => {
                            const permMaster = PERMISSIONS_MASTER.find(p => p.id === (app.permissionId || app.permissionCode)) || {
                              title: app.permissionName || app.permissionTitle,
                              authority: app.authority,
                              slaDays: app.slaDays || 15
                            };

                            return (
                              <tr key={app.id} className="hover:bg-slate-800/40 transition-colors">
                                <td className="py-4 px-4 whitespace-nowrap font-mono font-bold text-indigo-400">
                                  {app.id}
                                </td>
                                <td className="py-4 px-4">
                                  <div className="font-bold text-slate-100">{app.companyName || app.projectName}</div>
                                  <div className="text-[11px] text-slate-400">{app.estateName || 'Chakan Phase-2, Pune'}</div>
                                </td>
                                <td className="py-4 px-4 font-medium text-slate-200">
                                  {app.permissionName || app.permissionTitle}
                                </td>
                                <td className="py-4 px-4 whitespace-nowrap">
                                  <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                                    {app.authority}
                                  </span>
                                </td>
                                <td className="py-4 px-4 whitespace-nowrap font-mono text-slate-300">
                                  <div className="flex items-center space-x-1.5">
                                    <Icons.Clock className="w-3.5 h-3.5 text-amber-400" />
                                    <span>{app.slaTargetDate || '2026-09-18'}</span>
                                  </div>
                                </td>
                                <td className="py-4 px-4 text-center whitespace-nowrap">
                                  <span className={`px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider ${
                                    app.status === 'APPROVED' ? 'badge-approved' :
                                    app.status === 'IN_REVIEW' ? 'badge-review' :
                                    app.status === 'ACTION_REQUIRED' ? 'badge-action' : 'badge-pending'
                                  }`}>
                                    {app.status.replace('_', ' ')}
                                  </span>
                                </td>
                                <td className="py-4 px-4 text-right whitespace-nowrap">
                                  {app.status === 'APPROVED' ? (
                                    <button
                                      onClick={() => onOpenCertificateModal(app, permMaster)}
                                      className="px-3 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 text-xs font-semibold flex items-center space-x-1 ml-auto"
                                    >
                                      <Icons.Award className="w-3.5 h-3.5" />
                                      <span>View Issued NOC</span>
                                    </button>
                                  ) : (
                                    <button
                                      onClick={() => onOpenReviewModal(app, permMaster)}
                                      className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md flex items-center space-x-1 ml-auto"
                                    >
                                      <Icons.Eye className="w-3.5 h-3.5" />
                                      <span>Scrutinize & Action</span>
                                    </button>
                                  )}
                                </td>
                              </tr>
                            );
                          })
                        ) : (
                          <tr>
                            <td colSpan={7} className="py-12 text-center text-slate-400">
                              No applications found matching the selected filter criteria.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* ========================================================================= */}
            {/* MODAL 1: SCHEME DETAILED GUIDELINES & ELIGIBILITY MODAL                   */}
            {/* ========================================================================= */}
            {detailModalScheme && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
                <div className="glass-panel w-full max-w-3xl rounded-3xl border border-emerald-500/30 bg-slate-900 p-6 md:p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                  
                  {/* Modal Header */}
                  <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                    <div className="space-y-1">
                      <div className="flex items-center space-x-2">
                        <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                          {detailModalScheme.category}
                        </span>
                        <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          {detailModalScheme.type}
                        </span>
                      </div>
                      <h3 className="text-xl md:text-2xl font-black text-white font-heading mt-1">
                        {detailModalScheme.name}
                      </h3>
                      <p className="text-xs text-slate-400">
                        Nodal: <strong className="text-slate-200">{detailModalScheme.nodalAgency}</strong> • Policy Tenure: <span className="text-emerald-400 font-mono">{detailModalScheme.validity}</span>
                      </p>
                    </div>

                    <button
                      onClick={() => setDetailModalScheme(null)}
                      className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors"
                    >
                      <Icons.X className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Summary Scope */}
                  <div className="p-4 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 text-xs text-slate-200 leading-relaxed">
                    <strong className="text-emerald-400 uppercase tracking-wider block mb-1">Official Policy Directive:</strong>
                    {detailModalScheme.summary}
                  </div>

                  {/* Key Benefits Detailed Grid */}
                  <div className="space-y-2">
                    <h4 className="text-xs font-extrabold text-slate-300 uppercase tracking-wider">
                      Core Fiscal Subsidies & Benefits:
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {detailModalScheme.benefits.map((b, idx) => (
                        <div key={idx} className="p-3 rounded-xl bg-slate-950/70 border border-slate-800 space-y-1">
                          <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">{b.label}</span>
                          <span className="text-xs font-semibold text-emerald-300 block">{b.value}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Taluka Classification Table (if available, e.g. for PSI 2019) */}
                  {detailModalScheme.talukaClassification && (
                    <div className="space-y-2">
                      <h4 className="text-xs font-extrabold text-slate-300 uppercase tracking-wider">
                        Taluka-Wise Incentive Matrix (Zone Classification):
                      </h4>
                      <div className="rounded-xl border border-slate-800 overflow-hidden text-xs">
                        <table className="w-full text-left">
                          <thead className="bg-slate-950 text-slate-400 font-mono text-[10px] uppercase border-b border-slate-800">
                            <tr>
                              <th className="p-2.5">Taluka Zone</th>
                              <th className="p-2.5">Description</th>
                              <th className="p-2.5">SGST Subsidy</th>
                              <th className="p-2.5">Power Tariff</th>
                              <th className="p-2.5">Stamp Duty</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 font-body text-slate-300">
                            {detailModalScheme.talukaClassification.map((tz, tIdx) => (
                              <tr key={tIdx} className="hover:bg-slate-800/30">
                                <td className="p-2.5 font-bold font-mono text-emerald-400">{tz.zone}</td>
                                <td className="p-2.5 text-slate-400">{tz.description}</td>
                                <td className="p-2.5 font-mono text-white font-bold">{tz.sgst}</td>
                                <td className="p-2.5">{tz.power}</td>
                                <td className="p-2.5 text-indigo-300">{tz.stampDuty}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* Eligibility Criteria */}
                  <div className="p-4 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-1.5 text-xs text-slate-300">
                    <span className="text-xs font-extrabold text-indigo-300 uppercase tracking-wider block">
                      Enterprise Eligibility Criteria:
                    </span>
                    <p className="leading-relaxed">{detailModalScheme.eligibility}</p>
                  </div>

                  {/* Required Documents Checklist */}
                  <div className="space-y-2">
                    <span className="text-xs font-extrabold text-slate-300 uppercase tracking-wider block">
                      Required Documents for Scheme Application:
                    </span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                      {detailModalScheme.documents.map((doc, docIdx) => (
                        <div key={docIdx} className="p-2 rounded-lg bg-slate-950/60 border border-slate-800 flex items-start space-x-2 text-slate-300">
                          <Icons.FileCheck className="w-3.5 h-3.5 text-emerald-400 shrink-0 mt-0.5" />
                          <span className="leading-snug">{doc}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Modal Footer Actions */}
                  <div className="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3">
                    <button
                      onClick={() => setDetailModalScheme(null)}
                      className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-colors"
                    >
                      Close Window
                    </button>
                    <button
                      onClick={() => {
                        const s = detailModalScheme;
                        setDetailModalScheme(null);
                        setApplyModalScheme(s);
                        setApplyForm(prev => ({ ...prev, sector: s.industryTypes[0] || 'General Manufacturing' }));
                      }}
                      className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-lg shadow-emerald-600/30 transition-all flex items-center space-x-1.5"
                    >
                      <Icons.Award className="w-4 h-4" />
                      <span>Proceed to Apply Online</span>
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* MODAL 2: SCHEME ONLINE APPLICATION SIMULATION MODAL                       */}
            {/* ========================================================================= */}
            {applyModalScheme && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
                <div className="glass-panel w-full max-w-2xl rounded-3xl border border-emerald-500/40 bg-slate-900 p-6 md:p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                  
                  {/* Modal Header */}
                  <div className="flex items-start justify-between border-b border-slate-800 pb-4">
                    <div>
                      <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        Online Subsidy Application Portal
                      </span>
                      <h3 className="text-lg md:text-xl font-black text-white font-heading mt-1">
                        Apply for {applyModalScheme.name}
                      </h3>
                      <p className="text-xs text-slate-400">
                        Scheme Sub-type: <strong className="text-emerald-300">{applyModalScheme.type}</strong>
                      </p>
                    </div>

                    <button
                      onClick={() => setApplyModalScheme(null)}
                      className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors"
                    >
                      <Icons.X className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Application Form */}
                  <form onSubmit={handleApplySubmit} className="space-y-4 text-xs">
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      
                      <div className="space-y-1">
                        <label className="text-slate-300 font-bold block">Enterprise / Applicant Company Name:</label>
                        <input
                          type="text"
                          required
                          value={applyForm.companyName}
                          onChange={(e) => setApplyForm({ ...applyForm, companyName: e.target.value })}
                          className="glass-input w-full p-2.5 rounded-xl text-xs text-white border border-slate-700 bg-slate-950"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-slate-300 font-bold block">Manufacturing Sector / Industry Type:</label>
                        <input
                          type="text"
                          required
                          value={applyForm.sector}
                          onChange={(e) => setApplyForm({ ...applyForm, sector: e.target.value })}
                          className="glass-input w-full p-2.5 rounded-xl text-xs text-white border border-slate-700 bg-slate-950"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-slate-300 font-bold block">Proposed Fixed Capital Investment (₹ Lakhs):</label>
                        <input
                          type="number"
                          required
                          min="1"
                          value={applyForm.investment}
                          onChange={(e) => setApplyForm({ ...applyForm, investment: e.target.value })}
                          className="glass-input w-full p-2.5 rounded-xl text-xs text-white border border-slate-700 bg-slate-950"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-slate-300 font-bold block">Direct Employment Generated (Persons):</label>
                        <input
                          type="number"
                          required
                          min="1"
                          value={applyForm.employment}
                          onChange={(e) => setApplyForm({ ...applyForm, employment: e.target.value })}
                          className="glass-input w-full p-2.5 rounded-xl text-xs text-white border border-slate-700 bg-slate-950"
                        />
                      </div>

                      <div className="space-y-1">
                        <label className="text-slate-300 font-bold block">Taluka Zone Classification:</label>
                        <select
                          value={applyForm.talukaZone}
                          onChange={(e) => setApplyForm({ ...applyForm, talukaZone: e.target.value })}
                          className="glass-input w-full p-2.5 rounded-xl text-xs text-white border border-slate-700 bg-slate-950"
                        >

      // --- MODALS COMPONENTS ---
      
      // --- AI DOCUMENT VERIFICATION SYSTEM ---
      // 7-Stage Pipeline: Upload → Document Classification (AI) → OCR Extraction → Field Validation (Rules) → Cross-Document Consistency Check → Confidence Score → Auto-Approve / Flag for Review

      const VALID_DOCUMENT_TYPES = [
        "building_plan",
        "drainage_plan",
        "fire_noc",
        "water_connection",
        "cetp_membership",
        "power_noc",
        "plinth_completion",
        "bcc_oc",
        "factory_license",
        "pcb_consent",
        "site_plan",
        "other"
      ];

      // Document Classification (AI)
      function classifyDocumentText(extractedText) {
        if (!extractedText || typeof extractedText !== 'string') return "other";
        const t = extractedText.toLowerCase();

        const scores = {
          building_plan: 0,
          drainage_plan: 0,
          fire_noc: 0,
          water_connection: 0,
          cetp_membership: 0,
          power_noc: 0,
          plinth_completion: 0,
          bcc_oc: 0,
          factory_license: 0,
          pcb_consent: 0,
          site_plan: 0,
          other: 0.1
        };

        if (t.includes("building plan") || t.includes("architectural") || t.includes("blueprint") || t.includes("floor plan") || t.includes("built-up") || t.includes("midc dcr") || t.includes("fsi calculation") || t.includes("sanctioned plan")) scores.building_plan += 5;
        if (t.includes("drainage plan") || t.includes("drainage") || t.includes("sewer") || t.includes("storm water") || t.includes("plumbing layout") || t.includes("rainwater harvesting") || t.includes("invert level")) scores.drainage_plan += 5;
        if (t.includes("fire noc") || t.includes("fire prevention") || t.includes("fire safety") || t.includes("provisional fire") || t.includes("final fire") || t.includes("hydrant") || t.includes("fire fighting") || t.includes("sprinkler")) scores.fire_noc += 5;
        if (t.includes("water connection") || t.includes("water supply") || t.includes("bulk water") || t.includes("water pipeline") || t.includes("potable water") || t.includes("water allocation") || t.includes("meter connection")) scores.water_connection += 5;
        if (t.includes("cetp") || t.includes("common effluent") || t.includes("effluent treatment") || t.includes("chwtsdf") || t.includes("hydraulic discharge") || t.includes("inlet norms")) scores.cetp_membership += 5;
        if (t.includes("power noc") || t.includes("msedcl") || t.includes("ht power") || t.includes("substation") || t.includes("transformer") || t.includes("single line diagram") || t.includes("electrical inspector") || t.includes("cei approval")) scores.power_noc += 5;
        if (t.includes("plinth completion") || t.includes("plinth level") || t.includes("form b") || t.includes("foundation inspection") || t.includes("plinth checking") || t.includes("up to plinth")) scores.plinth_completion += 5;
        if (t.includes("bcc") || t.includes("occupancy certificate") || t.includes("building completion certificate") || t.includes("form c") || t.includes("fit for occupation")) scores.bcc_oc += 5;
        if (t.includes("factory license") || t.includes("dish") || t.includes("factories act") || t.includes("rule 3") || t.includes("form no. 2") || t.includes("form 2") || t.includes("licensed workers")) scores.factory_license += 5;
        if (t.includes("consent to establish") || t.includes("consent to operate") || t.includes("mpcb") || t.includes("cte") || t.includes("cto") || t.includes("pollution control board") || t.includes("air act") || t.includes("water act")) scores.pcb_consent += 5;
        if (t.includes("site plan") || t.includes("contour") || t.includes("demarcation") || t.includes("cadastral") || t.includes("topographical survey") || t.includes("boundary survey")) scores.site_plan += 4;

        let best = "other";
        let max = 0.5;
        for (const [k, v] of Object.entries(scores)) {
          if (v > max) {
            max = v;
            best = k;
          }
        }
        return best;
      }

      // OCR Extraction
      function extractFieldsFromText(text) {
        if (!text) return {
          document_number: null,
          issue_date: null,
          expiry_date: null,
          authority_name: null,
          plot_number: null,
          area_sqft: null
        };

        // 1. document_number
        let docNum = null;
        const docNumMatch = text.match(/(?:Document|Approval|Sanction|NOC|Certificate|Consent|Order|Ref|File|License)\s*(?:No\.?|Number|#)?\s*[:\-]?\s*([A-Za-z0-9\/\-_]{5,35})/i) ||
                            text.match(/\b((?:MIDC|FIRE|MPCB|MSEDCL|DISH|PWD|APP|FSSAI)[\/\-_A-Za-z0-9]{4,30})\b/i);
        if (docNumMatch) docNum = docNumMatch[1].trim();

        // 2. issue_date
        let issueDate = null;
        const issueDateMatch = text.match(/(?:Issue(?:d)?\s*Date|Date\s*of\s*Issue|Date)\s*[:\-]?\s*(\d{4}[\-\/]\d{1,2}[\-\/]\d{1,2}|\d{1,2}[\-\/]\d{1,2}[\-\/]\d{2,4})/i);
        if (issueDateMatch) issueDate = issueDateMatch[1].trim();

        // 3. expiry_date
        let expiryDate = null;
        const expiryDateMatch = text.match(/(?:Expiry\s*Date|Valid\s*(?:Up\s*To|Till|Until)|Validity)\s*[:\-]?\s*([A-Za-z0-9\s\-\/\.,]+?)(?=\n|\r|\.|$)/i);
        if (expiryDateMatch) {
          expiryDate = expiryDateMatch[1].trim();
        } else if (text.toLowerCase().includes("co-terminus")) {
          expiryDate = "Co-terminus with Building Plan";
        } else if (text.toLowerCase().includes("permanent")) {
          expiryDate = "Permanent";
        }

        // 4. authority_name
        let authorityName = null;
        if (/midc|maharashtra industrial development/i.test(text)) authorityName = "Maharashtra Industrial Development Corporation (MIDC)";
        else if (/fire services|fire dept|fire officer/i.test(text)) authorityName = "Directorate of Maharashtra Fire Services";
        else if (/mpcb|pollution control/i.test(text)) authorityName = "Maharashtra Pollution Control Board (MPCB)";
        else if (/msedcl|electricity distribution/i.test(text)) authorityName = "Maharashtra State Electricity Distribution Co. Ltd. (MSEDCL)";
        else if (/dish|industrial safety/i.test(text)) authorityName = "Directorate of Industrial Safety & Health (DISH)";
        else if (/water board|water supply division/i.test(text)) authorityName = "MIDC Water Supply Division";
        else {
          const authMatch = text.match(/(?:Issuing\s*Authority|Authority|Department)\s*[:\-]?\s*([A-Za-z\s\(\)\.,]{4,50})/i);
          if (authMatch) authorityName = authMatch[1].trim();
        }

        // 5. plot_number
        let plotNumber = null;
        const plotMatch = text.match(/Plot\s*(?:No\.?)?\s*([A-Za-z0-9\-]+(?:,\s*[A-Za-z0-9\s]+Phase\s*[I|V|X\d]+)?)/i) ||
                          text.match(/\b(Plot\s*(?:No\.?)?\s*[A-Za-z0-9\-]+)\b/i);
        if (plotMatch) plotNumber = plotMatch[1].trim();

        // 6. area_sqft
        let areaSqft = null;
        const areaMatch = text.match(/([0-9,]+(?:\.[0-9]+)?)\s*(sq\.?\s*ft|sqm|sq\s*meters|acres|hectares)/i);
        if (areaMatch) areaSqft = `${areaMatch[1]} ${areaMatch[2]}`.trim();

        return {
          document_number: docNum || "MIDC/DCR/2024/0912",
          issue_date: issueDate || "2024-02-15",
          expiry_date: expiryDate || "2027-02-14",
          authority_name: authorityName || "Maharashtra Industrial Development Corporation (MIDC)",
          plot_number: plotNumber || "Plot No. A-42",
          area_sqft: areaSqft || "108,900 sq.ft"
        };
      }

      // Complete 7-Stage Verification Pipeline Execution
      function runDocumentVerificationPipeline(extractedText, docTitle, project) {
        // Stage 1: Upload (Handled)
        // Stage 2: Document Classification (AI)
        const document_type = classifyDocumentText(extractedText);

        // Stage 3: OCR Extraction
        const extracted_fields = extractFieldsFromText(extractedText);

        // Stage 4: Field Validation (Rules)
        const field_validation = {
          document_number_valid: !!(extracted_fields.document_number && extracted_fields.document_number.length >= 4),
          date_format_valid: !!extracted_fields.issue_date,
          date_not_expired: true,
          authority_recognized: !!extracted_fields.authority_name,
          type_matches_slot: true
        };

        if (extracted_fields.expiry_date && 
            !extracted_fields.expiry_date.toLowerCase().includes('permanent') && 
            !extracted_fields.expiry_date.toLowerCase().includes('co-terminus') &&
            !extracted_fields.expiry_date.toLowerCase().includes('year')) {
          const expTime = Date.parse(extracted_fields.expiry_date);
          if (!isNaN(expTime) && expTime < Date.now()) {
            field_validation.date_not_expired = false;
          }
        }

        // Stage 5: Cross-Document Consistency Check
        const discrepancies = [];
        const projectPlotMatch = (project.location || '').match(/Plot\s*(?:No\.?)?\s*([A-Za-z0-9\-]+)/i);
        const expectedPlot = projectPlotMatch ? projectPlotMatch[1].toLowerCase() : 'a-42';

        let plotMatch = true;
        if (extracted_fields.plot_number) {
          const docPlot = extracted_fields.plot_number.toLowerCase();
          if (!docPlot.includes(expectedPlot) && !expectedPlot.includes(docPlot.replace(/[^a-z0-9]/g, ''))) {
            plotMatch = false;
            discrepancies.push(`Plot Mismatch: Document states '${extracted_fields.plot_number}', but Project is registered at '${project.location}'`);
          }
        }

        let companyMatch = true;
        if (project.companyName && extractedText.length > 50) {
          const compWords = project.companyName.toLowerCase().split(' ').filter(w => w.length > 3);
          const textLower = extractedText.toLowerCase();
          const hasCompany = compWords.some(w => textLower.includes(w));
          if (!hasCompany) {
            companyMatch = false;
            discrepancies.push(`Entity Verification: Company '${project.companyName}' not referenced in document.`);
          }
        }

        if (!field_validation.date_not_expired) {
          discrepancies.push(`Validity Expired: Document expired on ${extracted_fields.expiry_date}. Must be renewed.`);
        }

        // Stage 6: Confidence Score
        let confidence = 96;
        if (document_type === 'other') confidence -= 25;
        if (!field_validation.document_number_valid) confidence -= 15;
        if (!field_validation.date_not_expired) confidence -= 25;
        if (!plotMatch) confidence -= 25;
        if (!companyMatch) confidence -= 10;
        if (!extracted_fields.area_sqft) confidence -= 5;
        confidence = Math.max(25, Math.min(99, confidence));

        // Stage 7: Auto-Approve / Flag for Review
        const isAutoApprove = confidence >= 85 && discrepancies.length === 0 && field_validation.date_not_expired;
        const decision = isAutoApprove ? "AUTO_APPROVED" : "FLAGGED_FOR_REVIEW";

        return {
          document_type,
          extracted_fields,
          field_validation,
          cross_document_consistency: {
            plot_match: plotMatch,
            company_match: companyMatch,
            expected_plot: expectedPlot,
            discrepancies
          },
          confidence_score: confidence,
          decision,
          verified_at: new Date().toISOString()
        };
      }

      // Permission Application Wizard Modal with 7-Stage AI Verification Pipeline
      function PermissionApplicationModal({ permission, project, onClose, onSubmitApplication }) {
        const requiredDocuments = permission.requiredDocs || permission.documents || [];
        const [step, setStep] = useState(1);
        const [uploadedFiles, setUploadedFiles] = useState({});
        const [applicantNotes, setApplicantNotes] = useState('');
        const [undertakingAgreed, setUndertakingAgreed] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);

        // AI Verification Drawer / Inspection Modal State
        const [activeInspectIndex, setActiveInspectIndex] = useState(null);
        const [editableOCRText, setEditableOCRText] = useState('');
        const [liveVerificationResult, setLiveVerificationResult] = useState(null);

        // Upload and immediately run the 7-Stage AI Verification Pipeline
        const handleFileUpload = (docIndex, docName) => {
          const fakeFileName = docName.replace(/[^a-zA-Z0-9]/g, '_') + '_Approved.pdf';
          const ocrText = generateSampleOCRText(docName, project);
          const verification = runDocumentVerificationPipeline(ocrText, docName, project);

          setUploadedFiles(prev => ({
            ...prev,
            [docIndex]: {
              name: fakeFileName,
              size: (Math.random() * 3 + 1.2).toFixed(1) + ' MB',
              date: new Date().toISOString().split('T')[0],
              rawOCRText: ocrText,
              aiVerification: verification
            }
          }));
        };

        // Open Inspector Drawer for specific document
        const openInspector = (docIndex, docName) => {
          const currentFile = uploadedFiles[docIndex];
          const text = currentFile ? currentFile.rawOCRText : generateSampleOCRText(docName, project);
          const ver = currentFile ? currentFile.aiVerification : runDocumentVerificationPipeline(text, docName, project);

          setActiveInspectIndex(docIndex);
          setEditableOCRText(text);
          setLiveVerificationResult(ver);
        };

        const handleRerunVerification = () => {
          const docName = requiredDocuments[activeInspectIndex] || 'Document';

          setLiveVerificationResult(newVer);

          // Update uploaded file record
          if (uploadedFiles[activeInspectIndex]) {
            setUploadedFiles(prev => ({
              ...prev,
