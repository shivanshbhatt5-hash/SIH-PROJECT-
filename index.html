    <!-- Custom Glassmorphism Styles -->
    <style>
      body {
        background-color: #0b0f19;
        color: #f1f5f9;
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        border-color: rgba(99, 102, 241, 0.35);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.15);
      }
      .glass-input {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        outline: none;
        transition: all 0.2s ease;
      }
      .glass-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }
      .badge-approved {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .badge-pending {
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .badge-review {
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
        border: 1px solid rgba(99, 102, 241, 0.3);
      }
      .badge-action {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
        border: 1px solid rgba(244, 63, 94, 0.3);
      }
      .badge-draft {
        background: rgba(148, 163, 184, 0.15);
        color: #cbd5e1;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-certificate, #printable-certificate * {
          visibility: visible;
        }
        #printable-certificate {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: #ffffff !important;
          color: #1e293b !important;
          padding: 40px !important;
          box-shadow: none !important;
          border: 3px double #1e293b !important;
        }
        .no-print {
          display: none !important;
        }
      }
    
      /* Ambient Floating Orbs */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(45px, -55px) scale(1.1); }
        66% { transform: translate(-35px, 25px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(-50px, 35px) scale(1.08); }
        66% { transform: translate(25px, -45px) scale(1.15); }
      }
      @keyframes floatOrb3 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, 40px) scale(1.2); }
      }
      .orb-1 {
        position: fixed;
        top: -120px;
        left: 8%;
        width: 550px;
        height: 550px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(99, 102, 241, 0) 70%);
        filter: blur(70px);
        pointer-events: none;
        z-index: 0;
        animation: floatOrb1 20s ease-in-out infinite;
      }
      .orb-2 {
        position: fixed;
        top: 35%;
        right: -90px;
        width: 580px;
        height: 580px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.13) 0%, rgba(168, 85, 247, 0) 70%);
        filter: blur(75px);
        pointer-events: none;
        z-index: 0;
        animation: floatOrb2 24s ease-in-out infinite;
      }
      .orb-3 {
        position: fixed;
        bottom: -120px;
        left: 20%;
        width: 620px;
        height: 620px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
        filter: blur(80px);
        pointer-events: none;
        z-index: 0;
        animation: floatOrb3 28s ease-in-out infinite;
      }

      /* Glowing laser scanner for AI verification */
      @keyframes scanBeam {
        0% { top: 0%; opacity: 0.2; }
        20% { opacity: 1; }
        50% { top: 96%; opacity: 0.9; }
        80% { opacity: 1; }
        100% { top: 0%; opacity: 0.2; }
      }
      .laser-scanner-active {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, #38bdf8, transparent);
        box-shadow: 0 0 14px #38bdf8, 0 0 26px #818cf8;
        animation: scanBeam 2.4s ease-in-out infinite;
        pointer-events: none;
        z-index: 25;
      }

      /* Card Hover Lift & Glow */
      .card-animated {
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .card-animated:hover {
        transform: translateY(-4px) scale(1.008);
        box-shadow: 0 20px 35px -10px rgba(99, 102, 241, 0.22);
        border-color: rgba(99, 102, 241, 0.45);
      }

      /* Shimmer gradient text */
      @keyframes shimmerText {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .text-shimmer {
        background: linear-gradient(90deg, #f8fafc, #818cf8, #c084fc, #f8fafc);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerText 6s linear infinite;
      }

      /* Animated Progress Stripes */
      @keyframes moveStripes {
        0% { background-position: 0 0; }
        100% { background-position: 28px 0; }
      }
      .progress-striped {
        background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent);
        background-size: 28px 28px;
        animation: moveStripes 1.6s linear infinite;
      }

      /* Pulse radar dot */
      @keyframes pulseRadar {
        0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        100% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      .pulse-radar-green {
        animation: pulseRadar 2s infinite;
      }

      /* Glow borders */
      .glow-border-indigo {
        box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.35);
      }
      .glow-border-emerald {
        box-shadow: 0 0 20px -5px rgba(16, 185, 129, 0.35);
      }
      .glow-border-purple {
        box-shadow: 0 0 20px -5px rgba(168, 85, 247, 0.35);
      }
      .glow-border-amber {
        box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.35);
      }

    </style>

                    const IconComp = p.icon;
                    const isActive = activePortal === p.id;
                    let activeStyle = 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60';
                    
                    if (isActive) {
                      if (p.color === 'indigo') activeStyle = 'bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-md shadow-indigo-600/30 border border-indigo-400/40';
                      else if (p.color === 'emerald') activeStyle = 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md shadow-emerald-600/30 border border-emerald-400/40';
                      else if (p.color === 'cyan') activeStyle = 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-md shadow-cyan-600/30 border border-cyan-400/40';
                      else if (p.color === 'rose') activeStyle = 'bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-md shadow-rose-600/30 border border-rose-400/40';
                      else if (p.color === 'purple') activeStyle = 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md shadow-purple-600/30 border border-purple-400/40';
                    }

                      <button
                        key={p.id}

                      </select>
                      <Icons.ChevronDown className="w-3.5 h-3.5 text-slate-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
                    </div>
                  ) : (
                    <div className="relative">
                      <select
                        value={selectedProject.id}
                        onChange={(e) => {
                          const p = projects.find(item => item.id === e.target.value);
                          if (p) setSelectedProject(p);
                        }}
                        className="glass-input text-xs rounded-xl px-3 py-1.5 pr-7 appearance-none cursor-pointer focus:ring-2 focus:ring-indigo-500 font-medium text-slate-200 max-w-[170px] truncate"
                      >
                        {projects.map(proj => (
                          <option key={proj.id} value={proj.id} className="bg-slate-900 text-slate-200">
                            {proj.name}
                          </option>
                        ))}
                      </select>
                      <Icons.ChevronDown className="w-3.5 h-3.5 text-slate-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
                    </div>
                  )}

                  {/* Statutory Expiry Sentinel Assistant Quick Trigger */}
                  <button
                    onClick={onOpenRenewSentinel}
                    className="relative flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-600 via-orange-600 to-rose-600 hover:from-amber-500 text-white text-xs font-bold shadow-md shadow-amber-600/25 border border-amber-400/30 transition-all group"
                  >
                    <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
                    </span>
                    <Icons.Bell className="w-3.5 h-3.5 text-amber-200 group-hover:rotate-12 transition-transform" />
                    <span className="hidden sm:inline">Renewals (3)</span>
                  </button>

                  {/* AI Assistant Quick Trigger */}
                  <button
                    onClick={onOpenAdvisor}
                    className="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 text-white text-xs font-bold shadow-md shadow-purple-600/25 border border-purple-400/30 transition-all group"
                  >
                    <Icons.Bot className="w-3.5 h-3.5 text-purple-200 group-hover:rotate-12 transition-transform" />
                    <span className="hidden sm:inline">AI Assistant</span>
                  </button>

                  {/* User Profile Avatar */}
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-inner ${
                    activePortal === 'official' 
                      ? 'bg-gradient-to-tr from-emerald-500 to-teal-600' 
                      : 'bg-gradient-to-tr from-indigo-500 to-purple-600'
                  }`}>
                    {activePortal === 'official' ? 'SD' : 'RS'}
                  </div>
                </div>

              </div>

              {/* Mobile Portal Switcher row */}
              <div className="flex md:hidden items-center space-x-1 py-1.5 overflow-x-auto scrollbar-none border-t border-slate-800/60">
                {portals.map(p => (
                  <button
                    key={p.id}
                    onClick={() => setActivePortal(p.id)}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold whitespace-nowrap ${
                      activePortal === p.id ? 'bg-indigo-600 text-white' : 'text-slate-400 bg-slate-900'
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>

            </div>
          </header>
        );
      }

      // --- SUB-HEADER SECONDARY NAVIGATION BAR (DECLUTTERED & STREAMLINED) ---
      function SubHeaderBar({ activeTab, setActiveTab }) {
        const tabs = [
          { id: 'CORE_PERMISSIONS', label: '8 Major Clearances', count: '8', icon: Icons.ShieldCheck, color: 'amber' },
          { id: 'COMMON_PRE', label: 'Pre-Establishment', count: '10', icon: Icons.FolderCheck, color: 'blue' },
          { id: 'COMMON_POST', label: 'Post-Establishment', count: '9', icon: Icons.CheckCircle2, color: 'emerald' },
          { id: 'INDUSTRY_SPECIFIC', label: 'According to Industry Type', count: '7', icon: Icons.Briefcase, color: 'purple' }
        ];

        return (
          <div className="sticky top-16 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 py-2 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between gap-2 overflow-x-auto scrollbar-none">
                {tabs.map(t => {
                  const Icon = t.icon;
                  const isActive = activeTab === t.id;
                  
                  let activeClass = 'bg-slate-900/80 text-slate-400 hover:text-slate-200 border-slate-800 hover:bg-slate-800/60';
                  if (isActive) {
                    if (t.color === 'amber') activeClass = 'bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white border-amber-400/50 shadow-md shadow-orange-600/20';
                    else if (t.color === 'blue') activeClass = 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-blue-400/50 shadow-md shadow-blue-600/20';
                    else if (t.color === 'emerald') activeClass = 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white border-emerald-400/50 shadow-md shadow-emerald-600/20';
                    else if (t.color === 'purple') activeClass = 'bg-gradient-to-r from-purple-600 to-pink-600 text-white border-purple-400/50 shadow-md shadow-purple-600/20';
                  }

                  return (
                    <button
                      key={t.id}
                      onClick={() => setActiveTab(t.id)}
                      className={`flex-1 min-w-[190px] px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-2 border whitespace-nowrap ${activeClass}`}
                    >
                      <Icon className="w-3.5 h-3.5 shrink-0" />
                      <span>{t.label}</span>
                      <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-mono ${
                        isActive ? 'bg-black/25 text-white' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {t.count}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      function DocumentCategoryView({ 
        activeCategoryTab, 
        project = {}, 
        applications = [], 
        onOpenApplyModal, 
        onOpenDetailModal, 
        onOpenCertificateModal 
      }) {
        const [selectedSectorIndex, setSelectedSectorIndex] = useState(0);
        const [searchQuery, setSearchQuery] = useState('');
        const [subFilter, setSubFilter] = useState('ALL');
        const [statusFilter, setStatusFilter] = useState('ALL');
        const [expandedCard, setExpandedCard] = useState(null);

        const toggleExpand = (idx) => {
          setExpandedCard(prev => prev === idx ? null : idx);
        };

        // Helper to construct normalized permission object for Apply / Detail modals
        const makeDocPerm = (item, prefix, defaultPhaseName) => {
          return {
            id: item.permId || `${prefix}_${item.id}`,
            code: item.code || `${prefix.toUpperCase()}-${item.id}`,
            name: item.title,
            title: item.title,
            authority: item.authority,
            authorityKey: item.authorityKey || (item.authority ? item.authority.toUpperCase().replace(/[^A-Z]/g, '_') : 'MIDC'),
            regulatoryBody: item.regulatoryBody,
            category: item.category || defaultPhaseName,
            fee: item.fee || '₹5,000',
            slaDays: item.rtsSla ? (parseInt(item.rtsSla) || 15) : 15,
            rtsSla: item.rtsSla || '15 Days SLA',
            phase: {
              id: prefix,
              label: defaultPhaseName,
              badge: defaultPhaseName
            },
            requiredDocs: item.documents || item.mandatoryFiles || [
              'Application Form with digital signature',
              'Site location plan & plot allotment letter',
              'Board resolution & authorized signatory proof'
            ],
            documents: item.documents || item.mandatoryFiles || [
              'Application Form with digital signature',
              'Site location plan & plot allotment letter',
              'Board resolution & authorized signatory proof'
            ]
          };
        };

        // Helper to find any active or past application matching this document
        const findDocApp = (permObj) => {
          if (!applications || applications.length === 0) return null;
          
          // 1. Direct permissionId match
          let found = applications.find(a => a.permissionId === permObj.id && (a.projectId === project?.id || !a.projectId));
          if (found) return found;

          // 2. Direct code match
          if (permObj.code) {
            found = applications.find(a => a.permissionCode === permObj.code);
            if (found) return found;
          }

          // 3. Exact or keyword match on title / permissionName
          const t1 = permObj.title.toLowerCase().replace(/[^a-z0-9]/g, '');
          found = applications.find(a => {
            const name = (a.permissionTitle || a.permissionName || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!name) return false;
            return t1 === name || (t1.length > 5 && name.includes(t1)) || (name.length > 5 && t1.includes(name));
          });
          if (found) return found;

          // 4. Special keyword cross-checks
          const lowerTitle = permObj.title.toLowerCase();
          if (lowerTitle.includes('fire noc')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('fire noc'));
          }
          if (lowerTitle.includes('consent to establish') || lowerTitle.includes('cte')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('consent to establish') || (a.permissionCode || '') === 'POLLUTION_CTE');
          }
          if (lowerTitle.includes('consent to operate') || lowerTitle.includes('cto')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('consent to operate') || (a.permissionCode || '') === 'POLLUTION_CTO');
          }
          if (lowerTitle.includes('cetp')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('cetp'));
          }
          if (lowerTitle.includes('building plan')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('building plan'));
          }
          if (lowerTitle.includes('water')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('water'));
          }
          if (lowerTitle.includes('power') || lowerTitle.includes('electricity')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('power') || (a.permissionName || '').toLowerCase().includes('electricity'));
          }
          if (lowerTitle.includes('factory license') || lowerTitle.includes('dish')) {
            return applications.find(a => (a.permissionName || '').toLowerCase().includes('factory license'));
          }

          return null;
        };

        // --- OPTION 2: PRE-ESTABLISHMENT DOCUMENTS ---
        if (activeCategoryTab === 'COMMON_PRE') {
          const rawItems = DOCUMENT_CATEGORIES_DATA.COMMON_PRE.items;
          
          const filteredItems = rawItems.filter((item, idx) => {
            const q = searchQuery.toLowerCase();
            const matchesSearch = item.title.toLowerCase().includes(q) || item.authority.toLowerCase().includes(q);
            
            if (!matchesSearch) return false;
            if (subFilter === 'ALL') return true;
            if (subFilter === 'CORP') return idx === 0 || idx === 1 || idx === 6; // IEM A, MSME, GST
            if (subFilter === 'SAFETY') return idx === 2 || idx === 3 || idx === 4 || idx === 5; // CTE, DISH Plan, Fire NOC, PWD
            if (subFilter === 'LOCAL') return idx === 7 || idx === 8 || idx === 9; // Shops, Trade, EC
            return true;
          });

          return (
            <div className="space-y-6 animate-fade-in pb-12">
              {/* Header & Sub-filter bar */}
              <div className="glass-panel rounded-2xl p-6 border border-blue-500/30 bg-gradient-to-r from-slate-900 via-blue-950/25 to-slate-900 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30">
                      PRE-ESTABLISHMENT STAGE • COMMON FOR ALL
                    </span>
                    <span className="text-xs text-slate-400">10 Statutory Clearances</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black text-white font-heading mt-1">
                    Pre Industry Establishment Documents
                  </h2>
                  <p className="text-xs text-slate-300 mt-0.5">
                    Clearances and statutory permits required before factory civil construction breaks ground. Track status or apply online with 7-Stage AI Verification.
                  </p>
                </div>

                {/* Search Bar */}
                <div className="relative w-full md:w-72 shrink-0">
                  <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Filter pre-establishment docs..."
                    className="w-full glass-input text-xs rounded-xl pl-9 pr-3 py-2 text-white"
                  />
                </div>
              </div>

              {/* Sorted Phase Category Sub-Tabs + Status Filter */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 overflow-x-auto pb-1 scrollbar-none text-xs">
                <div className="flex items-center gap-2 overflow-x-auto scrollbar-none">
                  <span className="text-[11px] font-mono text-slate-400 font-bold uppercase shrink-0">Phase:</span>
                  {[
                    { id: 'ALL', label: 'All Documents (10)' },
                    { id: 'CORP', label: '1. Corporate & Tax (3)' },
                    { id: 'SAFETY', label: '2. Civil, Fire & Safety (4)' },
                    { id: 'LOCAL', label: '3. Local Body & Env (3)' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setSubFilter(tab.id)}
                      className={`px-3 py-1.5 rounded-lg font-semibold transition-all whitespace-nowrap border ${
                        subFilter === tab.id
                          ? 'bg-blue-600 text-white border-blue-400/50 shadow-md'
                          : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Status Quick Filter */}
                <div className="flex items-center gap-1.5 shrink-0">
                  <span className="text-[11px] font-mono text-slate-400 font-bold uppercase shrink-0">Status:</span>
                  {[
                    { id: 'ALL', label: 'All' },
                    { id: 'NOT_STARTED', label: 'Not Started' },
                    { id: 'IN_SCRUTINY', label: 'In Scrutiny' },
                    { id: 'APPROVED', label: 'Approved' }
                  ].map(sf => (
                    <button
                      key={sf.id}
                      onClick={() => setStatusFilter(sf.id)}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all border ${
                        statusFilter === sf.id
                          ? 'bg-indigo-600 text-white border-indigo-400'
                          : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                      }`}
                    >
                      {sf.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Grid of Decluttered Document Cards with Track & Apply */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredItems.map((item, idx) => {
                  const isExpanded = expandedCard === `pre-${idx}`;
                  const perm = makeDocPerm(item, 'pre', 'Pre-Establishment');
                  const app = findDocApp(perm);

                  const isApproved = app && (app.status === 'Approved' || app.status === 'APPROVED');
                  const isInReview = app && (app.status === 'Under Review' || app.status === 'IN_REVIEW' || app.status === 'Submitted');
                  const isAction = app && (app.status === 'Action Required' || app.status === 'ACTION_REQUIRED');

                  if (statusFilter === 'APPROVED' && !isApproved) return null;
                  if (statusFilter === 'IN_SCRUTINY' && !isInReview) return null;
                  if (statusFilter === 'NOT_STARTED' && app) return null;

                  return (
                    <div
                      key={idx}
                      className="glass-card card-animated rounded-2xl p-4 border border-slate-800 hover:border-blue-500/40 transition-all flex flex-col justify-between space-y-3 bg-slate-900/70 shadow-lg"
                    >
                      <div className="space-y-2.5">
                        {/* Header: Phase badge & Status badge */}
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">
                              #{item.id || idx + 1} Pre-Establishment
                            </span>
                            {app && (
                              <span className="text-[10px] font-mono text-slate-300 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                                {app.id}
                              </span>
                            )}
                          </div>
                          <div>
                            {isApproved ? (
                              <span className="badge-approved px-2 py-0.5 rounded-full text-[10px] font-bold">APPROVED</span>
                            ) : isInReview ? (
                              <span className="badge-pending px-2 py-0.5 rounded-full text-[10px] font-bold">IN SCRUTINY</span>
                            ) : isAction ? (
                              <span className="badge-action px-2 py-0.5 rounded-full text-[10px] font-bold">ACTION NEEDED</span>
                            ) : (
                              <span className="badge-draft px-2 py-0.5 rounded-full text-[10px] font-bold">NOT STARTED</span>
                            )}
                          </div>
                        </div>

                        {/* Title */}
                        <h3 className="font-bold text-sm text-white font-heading leading-snug">
                          {item.title}
                        </h3>

                        {/* Authority & RTS SLA */}
                        <div className="flex items-center justify-between text-xs text-slate-300">
                          <span className="flex items-center space-x-1 bg-slate-800/80 px-2 py-0.5 rounded text-[11px] text-slate-200 border border-slate-700/60 truncate max-w-[65%]">
                            <span className="text-blue-400 font-bold">Auth:</span>
                            <span className="truncate">{item.authority}</span>
                          </span>
                          <span className="text-[10px] font-mono text-blue-300 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20 shrink-0">
                            {perm.rtsSla}
                          </span>
                        </div>

                        {/* Regulatory Description */}
                        <p className="text-[11px] text-slate-400 line-clamp-2">
                          {item.regulatoryBody || item.legalReference || 'Statutory clearance under Maharashtra Industrial Policy.'}
                        </p>

                        {/* Collapsible Checklist Drawer */}
                        {isExpanded && (
                          <div className="pt-2 border-t border-slate-800/80 space-y-2 text-xs animate-fade-in">
                            <span className="text-[10px] font-mono font-bold text-blue-300 uppercase block">Mandatory Files ({perm.requiredDocs.length}):</span>
                            <ul className="space-y-1 text-[11px] text-slate-300 max-h-36 overflow-y-auto pr-1">
                              {perm.requiredDocs.map((f, i) => (
                                <li key={i} className="flex items-start space-x-1.5">
                                  <Icons.Check className="w-3.5 h-3.5 text-blue-400 shrink-0 mt-0.5" />
                                  <span>{typeof f === 'string' ? f : f.name}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>

                      {/* Footer: Checklist Toggle & Track / Apply Buttons */}
                      <div className="pt-2.5 border-t border-slate-800/70 space-y-2">
                        <div className="flex items-center justify-between text-[11px]">
                          <button
                            onClick={() => toggleExpand(`pre-${idx}`)}
                            className="font-semibold text-blue-400 hover:text-blue-300 flex items-center space-x-1 transition-colors"
                          >
                            <span>{isExpanded ? 'Hide Checklist ▲' : 'View Checklist ▾'}</span>
                          </button>
                          <span className="text-[10px] font-mono text-slate-400">
                            Fee: {item.fee || '₹5,000'}
                          </span>
                        </div>

                        {/* Main Action Button */}
                        {isApproved ? (
                          <button
                            onClick={() => onOpenCertificateModal && onOpenCertificateModal(app, perm)}
                            className="w-full py-2 px-3 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-md flex items-center justify-center space-x-1.5 transition-all"
                          >
                            <Icons.Download className="w-3.5 h-3.5" />
                            <span>Download Certificate</span>
                          </button>
                        ) : app ? (
                          <button
                            onClick={() => onOpenDetailModal && onOpenDetailModal(app, perm)}
                            className={`w-full py-2 px-3 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-1.5 transition-all shadow-md ${
                              isAction
                                ? 'bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 shadow-rose-600/25'
                                : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 shadow-blue-600/25'
                            }`}
                          >
                            <Icons.Eye className="w-3.5 h-3.5" />
                            <span>{isAction ? 'Respond to Query' : 'Track Status'}</span>
                          </button>
                        ) : (
                          <button
                            onClick={() => onOpenApplyModal && onOpenApplyModal(perm)}
                            className="w-full py-2 px-3 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 shadow-md shadow-blue-600/25 flex items-center justify-center space-x-1.5 transition-all"
                          >
                            <Icons.UploadCloud className="w-3.5 h-3.5" />
                            <span>Apply Online</span>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        // --- OPTION 3: POST-ESTABLISHMENT DOCUMENTS ---
        if (activeCategoryTab === 'COMMON_POST') {
          const rawItems = DOCUMENT_CATEGORIES_DATA.COMMON_POST.items;
          
          const filteredItems = rawItems.filter((item, idx) => {
            const q = searchQuery.toLowerCase();
            const matchesSearch = item.title.toLowerCase().includes(q) || item.authority.toLowerCase().includes(q);
            
            if (!matchesSearch) return false;
            if (subFilter === 'ALL') return true;
            if (subFilter === 'OPERATE') return idx === 0 || idx === 1 || idx === 3; // IEM B, CTO, Factory License
            if (subFilter === 'SAFETY') return idx === 2 || idx === 6 || idx === 8; // Stability, Final Fire, DG Set
            if (subFilter === 'ENV_LABOUR') return idx === 4 || idx === 5 || idx === 7; // CHWTSDF, CETP, PF/ESI
            return true;
          });

          return (
            <div className="space-y-6 animate-fade-in pb-12">
              {/* Header & Sub-filter bar */}
              <div className="glass-panel rounded-2xl p-6 border border-emerald-500/30 bg-gradient-to-r from-slate-900 via-emerald-950/25 to-slate-900 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      POST-ESTABLISHMENT STAGE • COMMON FOR ALL
                    </span>
                    <span className="text-xs text-slate-400">9 Statutory Clearances</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black text-white font-heading mt-1">
                    Post Industry Establishment Documents
                  </h2>
                  <p className="text-xs text-slate-300 mt-0.5">
                    Clearances and statutory licenses required after construction completion before starting commercial operations. Track scrutiny or apply directly.
                  </p>
                </div>

                {/* Search Bar */}
                <div className="relative w-full md:w-72 shrink-0">
                  <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Filter post-establishment docs..."
                    className="w-full glass-input text-xs rounded-xl pl-9 pr-3 py-2 text-white"
                  />
                </div>
              </div>

              {/* Sorted Phase Category Sub-Tabs + Status Filter */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 overflow-x-auto pb-1 scrollbar-none text-xs">
                <div className="flex items-center gap-2 overflow-x-auto scrollbar-none">
                  <span className="text-[11px] font-mono text-slate-400 font-bold uppercase shrink-0">Phase:</span>
                  {[
                    { id: 'ALL', label: 'All Documents (9)' },
                    { id: 'OPERATE', label: '1. Factory Operation & DISH (3)' },
                    { id: 'SAFETY', label: '2. Fire Safety & Building (3)' },
                    { id: 'ENV_LABOUR', label: '3. Waste, CETP & Labour (3)' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setSubFilter(tab.id)}
                      className={`px-3 py-1.5 rounded-lg font-semibold transition-all whitespace-nowrap border ${
                        subFilter === tab.id
                          ? 'bg-emerald-600 text-white border-emerald-400/50 shadow-md'
                          : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Status Quick Filter */}
                <div className="flex items-center gap-1.5 shrink-0">
                  <span className="text-[11px] font-mono text-slate-400 font-bold uppercase shrink-0">Status:</span>
                  {[
                    { id: 'ALL', label: 'All' },
                    { id: 'NOT_STARTED', label: 'Not Started' },
                    { id: 'IN_SCRUTINY', label: 'In Scrutiny' },
                    { id: 'APPROVED', label: 'Approved' }
                  ].map(sf => (
                    <button
                      key={sf.id}
                      onClick={() => setStatusFilter(sf.id)}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all border ${
                        statusFilter === sf.id
                          ? 'bg-emerald-600 text-white border-emerald-400'
                          : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200'
                      }`}
                    >
                      {sf.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Grid of Decluttered Document Cards with Track & Apply */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredItems.map((item, idx) => {
                  const isExpanded = expandedCard === `post-${idx}`;
                  const perm = makeDocPerm(item, 'post', 'Post-Establishment');
                  const app = findDocApp(perm);

                  const isApproved = app && (app.status === 'Approved' || app.status === 'APPROVED');
                  const isInReview = app && (app.status === 'Under Review' || app.status === 'IN_REVIEW' || app.status === 'Submitted');
                  const isAction = app && (app.status === 'Action Required' || app.status === 'ACTION_REQUIRED');

                  if (statusFilter === 'APPROVED' && !isApproved) return null;
                  if (statusFilter === 'IN_SCRUTINY' && !isInReview) return null;
                  if (statusFilter === 'NOT_STARTED' && app) return null;

                  return (
                    <div
                      key={idx}
                      className="glass-card card-animated rounded-2xl p-4 border border-slate-800 hover:border-emerald-500/40 transition-all flex flex-col justify-between space-y-3 bg-slate-900/70 shadow-lg"
                    >
                      <div className="space-y-2.5">
                        {/* Header: Phase badge & Status badge */}
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                              #{item.id || idx + 1} Post-Establishment
                            </span>
                            {app && (
                              <span className="text-[10px] font-mono text-slate-300 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                                {app.id}
                              </span>
                            )}
                          </div>
                          <div>
                            {isApproved ? (
                              <span className="badge-approved px-2 py-0.5 rounded-full text-[10px] font-bold">APPROVED</span>
                            ) : isInReview ? (
                              <span className="badge-pending px-2 py-0.5 rounded-full text-[10px] font-bold">IN SCRUTINY</span>
                            ) : isAction ? (
                              <span className="badge-action px-2 py-0.5 rounded-full text-[10px] font-bold">ACTION NEEDED</span>
                            ) : (
                              <span className="badge-draft px-2 py-0.5 rounded-full text-[10px] font-bold">NOT STARTED</span>
                            )}
                          </div>
                        </div>

                        {/* Title */}
                        <h3 className="font-bold text-sm text-white font-heading leading-snug">
                          {item.title}
                        </h3>

                        {/* Authority & RTS SLA */}
                        <div className="flex items-center justify-between text-xs text-slate-300">
                          <span className="flex items-center space-x-1 bg-slate-800/80 px-2 py-0.5 rounded text-[11px] text-slate-200 border border-slate-700/60 truncate max-w-[65%]">
                            <span className="text-emerald-400 font-bold">Auth:</span>
                            <span className="truncate">{item.authority}</span>
                          </span>
                          <span className="text-[10px] font-mono text-emerald-300 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 shrink-0">
                            {perm.rtsSla}
                          </span>
                        </div>

                        {/* Regulatory Description */}
                        <p className="text-[11px] text-slate-400 line-clamp-2">
                          {item.regulatoryBody || item.legalReference || 'Mandatory compliance under Factories Act 1948 & Water/Air Acts.'}
                        </p>

                        {/* Collapsible Checklist Drawer */}
                        {isExpanded && (
                          <div className="pt-2 border-t border-slate-800/80 space-y-2 text-xs animate-fade-in">
                            <span className="text-[10px] font-mono font-bold text-emerald-300 uppercase block">Inspection & Compliance ({perm.requiredDocs.length}):</span>
                            <ul className="space-y-1 text-[11px] text-slate-300 max-h-36 overflow-y-auto pr-1">
                              {perm.requiredDocs.map((f, i) => (
                                <li key={i} className="flex items-start space-x-1.5">
                                  <Icons.Check className="w-3.5 h-3.5 text-emerald-400 shrink-0 mt-0.5" />
                                  <span>{typeof f === 'string' ? f : f.name}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>

                      {/* Footer: Checklist Toggle & Track / Apply Buttons */}
                      <div className="pt-2.5 border-t border-slate-800/70 space-y-2">
                        <div className="flex items-center justify-between text-[11px]">
                          <button
                            onClick={() => toggleExpand(`post-${idx}`)}
                            className="font-semibold text-emerald-400 hover:text-emerald-300 flex items-center space-x-1 transition-colors"
                          >
                            <span>{isExpanded ? 'Hide Checklist ▲' : 'View Checklist ▾'}</span>
                          </button>
                          <span className="text-[10px] font-mono text-slate-400">
                            Fee: {item.fee || '₹8,000'}
                          </span>
                        </div>

                        {/* Main Action Button */}
                        {isApproved ? (
                          <button
                            onClick={() => onOpenCertificateModal && onOpenCertificateModal(app, perm)}
                            className="w-full py-2 px-3 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-md flex items-center justify-center space-x-1.5 transition-all"
                          >
                            <Icons.Download className="w-3.5 h-3.5" />
                            <span>Download Certificate</span>
                          </button>
                        ) : app ? (
                          <button
                            onClick={() => onOpenDetailModal && onOpenDetailModal(app, perm)}
                            className={`w-full py-2 px-3 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-1.5 transition-all shadow-md ${
                              isAction
                                ? 'bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 shadow-rose-600/25'
                                : 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-emerald-600/25'
                            }`}
                          >
                            <Icons.Eye className="w-3.5 h-3.5" />
                            <span>{isAction ? 'Respond to Query' : 'Track Status'}</span>
                          </button>
                        ) : (
                          <button
                            onClick={() => onOpenApplyModal && onOpenApplyModal(perm)}
                            className="w-full py-2 px-3 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-md shadow-emerald-600/25 flex items-center justify-center space-x-1.5 transition-all"
                          >
                            <Icons.UploadCloud className="w-3.5 h-3.5" />
                            <span>Apply Online</span>
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        // --- OPTION 4: INDUSTRY-SPECIFIC DOCUMENTS ---
        const sectors = DOCUMENT_CATEGORIES_DATA.INDUSTRY_SPECIFIC.sectors;
        const currentSector = sectors[selectedSectorIndex] || sectors[0];

        return (
          <div className="space-y-6 animate-fade-in pb-12">
            {/* Top Banner */}
            <div className="glass-panel rounded-2xl p-6 border border-purple-500/30 bg-gradient-to-r from-slate-900 via-purple-950/25 to-slate-900">
              <div className="flex items-center space-x-2">
                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                  CPCB CLASSIFICATION & SECTORAL NORMS
                </span>
                <span className="text-xs text-slate-400">7 Specialized Industrial Categories</span>
              </div>
              <h2 className="text-xl sm:text-2xl font-black text-white font-heading mt-1">
                According to Industry Type Documents
              </h2>
              <p className="text-xs text-slate-300 mt-0.5">
                Select your industrial manufacturing sector to inspect dedicated regulatory compliance mandates, track application status, or apply directly online.
              </p>
            </div>

            {/* Decluttered Category Selector Pills */}
            <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
              {sectors.map((sec, idx) => {
                const sName = sec.shortName || sec.sectorName || sec.industryType || `Sector ${idx+1}`;
                return (
                  <button
                    key={idx}
                    onClick={() => setSelectedSectorIndex(idx)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap border flex items-center space-x-1.5 ${
                      selectedSectorIndex === idx
                        ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-purple-400/50 shadow-md shadow-purple-600/25 ring-1 ring-purple-400/30'
                        : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    <span className="w-2 h-2 rounded-full bg-purple-400 shrink-0"></span>
                    <span>{sName.split('(')[0].trim()}</span>
                  </button>
                );
              })}
            </div>

            {/* Focused Sector Compliance Detail Card */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-6 bg-slate-900/80">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
                <div>
                  <span className="text-[10px] font-mono uppercase font-bold text-purple-400">Sector Compliance Profile:</span>
                  <h3 className="text-lg font-black text-white font-heading mt-0.5">
                    {currentSector.sectorName || currentSector.industryType || currentSector.shortName}
                  </h3>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">
                    {currentSector.badge || `Category #${selectedSectorIndex + 1}`}
                  </span>
                </div>
              </div>

              {/* Requirements & Description */}
              <div className="space-y-3">
                <h4 className="text-xs font-bold uppercase text-slate-400">Statutory Clearances & Compliance Scope:</h4>
                <div className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 text-xs text-slate-200 leading-relaxed">
                  {currentSector.requiredDocsText || currentSector.additionalRequirements || 'Full CTE + CTO compliance and environmental monitoring.'}
                </div>
              </div>

              {/* Sub-documents required with Track & Apply */}
              {currentSector.documents && currentSector.documents.length > 0 && (
                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase text-slate-400">Specific Required Approvals & Filings ({currentSector.documents.length}):</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {currentSector.documents.map((doc, dIdx) => {
                      const docTitle = doc.docTitle || doc.title || doc;
                      const perm = makeDocPerm({
                        id: `sec_${selectedSectorIndex}_${dIdx + 1}`,
                        title: docTitle,
                        authority: doc.authority || 'State Authority',
                        rtsSla: doc.rtsSla || '21 Days SLA',
                        documents: [
                          'Mandatory Sectoral Compliance Dossier',
                          'Process Flowchart & Safety Audit Certification'
                        ]
                      }, 'sector', currentSector.shortName || 'Sectoral');
                      const app = findDocApp(perm);

                      const isApproved = app && (app.status === 'Approved' || app.status === 'APPROVED');
                      const isInReview = app && (app.status === 'Under Review' || app.status === 'IN_REVIEW' || app.status === 'Submitted');
                      const isAction = app && (app.status === 'Action Required' || app.status === 'ACTION_REQUIRED');

                      return (
                        <div key={dIdx} className="p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-purple-500/40 text-xs flex flex-col justify-between space-y-3 transition-all">
                          <div className="space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-mono text-purple-300 bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/20">
                                {doc.authority || 'MIDC / MPCB'}
                              </span>
                              <div>
                                {isApproved ? (
                                  <span className="badge-approved px-2 py-0.5 rounded-full text-[10px] font-bold">APPROVED</span>
                                ) : isInReview ? (
                                  <span className="badge-pending px-2 py-0.5 rounded-full text-[10px] font-bold">IN SCRUTINY</span>
                                ) : isAction ? (
                                  <span className="badge-action px-2 py-0.5 rounded-full text-[10px] font-bold">ACTION NEEDED</span>
                                ) : (
                                  <span className="badge-draft px-2 py-0.5 rounded-full text-[10px] font-bold">NOT STARTED</span>
                                )}
                              </div>
                            </div>
                            <p className="font-bold text-sm text-slate-100">{docTitle}</p>
                            <p className="text-[11px] text-slate-400 font-mono">SLA: {doc.rtsSla || '21 Days SLA'}</p>
                          </div>

                          <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between gap-2">
                            {app && (
                              <span className="text-[10px] font-mono text-slate-400 truncate">{app.id}</span>
                            )}
                            <div className="flex-1 text-right">
                              {isApproved ? (
                                <button
                                  onClick={() => onOpenCertificateModal && onOpenCertificateModal(app, perm)}
                                  className="py-1.5 px-3 rounded-lg text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 shadow-md inline-flex items-center space-x-1"
                                >
                                  <Icons.Download className="w-3.5 h-3.5" />
                                  <span>Certificate</span>
                                </button>
                              ) : app ? (
                                <button
                                  onClick={() => onOpenDetailModal && onOpenDetailModal(app, perm)}
                                  className="py-1.5 px-3 rounded-lg text-xs font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 shadow-md inline-flex items-center space-x-1"
                                >
                                  <Icons.Eye className="w-3.5 h-3.5" />
                                  <span>Track</span>
                                </button>
                              ) : (
                                <button
                                  onClick={() => onOpenApplyModal && onOpenApplyModal(perm)}
                                  className="py-1.5 px-3 rounded-lg text-xs font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 shadow-md shadow-purple-600/20 inline-flex items-center space-x-1"
                                >
                                  <Icons.UploadCloud className="w-3.5 h-3.5" />
                                  <span>Apply</span>
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }


      // ==========================================
      // DECLUTTERED & SORTED INDUSTRIALIST DASHBOARD
      // ==========================================

      function IndustrialistDashboard({ project, applications, onOpenApplyModal, onOpenDetailModal, onOpenCertificateModal, onOpenAdvisor }) {
        const [stageFilter, setStageFilter] = useState('ALL');
        const [statusFilter, setStatusFilter] = useState('ALL');
        const [sortBy, setSortBy] = useState('DEFAULT');
        const [searchQuery, setSearchQuery] = useState('');
        const [expandedCardId, setExpandedCardId] = useState(null);

        const toggleCardExpand = (id) => {
          setExpandedCardId(prev => prev === id ? null : id);
        };

        const authorityIcons = {
          MIDC: <Icons.Building className="w-4 h-4 text-indigo-400" />,
          FIRE_DEPT: <Icons.Flame className="w-4 h-4 text-rose-400" />,
          WATER_BOARD: <Icons.Droplets className="w-4 h-4 text-cyan-400" />,
          POLLUTION_BOARD: <Icons.Leaf className="w-4 h-4 text-emerald-400" />,
          ELECTRICITY_BOARD: <Icons.Zap className="w-4 h-4 text-yellow-400" />
        };

        const getAppForPermission = (permissionId) => {
          return applications.find(app => app.permissionId === permissionId && app.projectId === project.id);
        };

        // Classify the 8 Major Permissions into clean statutory Phases
        const getPermissionPhase = (idx) => {
          if (idx === 0 || idx === 1 || idx === 4) return { id: 'PHASE1', label: 'Phase 1: Pre-Construction', badge: 'Pre-Construction' };
          if (idx === 6 || idx === 2) return { id: 'PHASE2', label: 'Phase 2: Civil & Drainage', badge: 'Civil Works' };
          if (idx === 5) return { id: 'PHASE3', label: 'Phase 3: Environmental Linkage', badge: 'Environmental' };
          return { id: 'PHASE4', label: 'Phase 4: Completion & Occupancy', badge: 'Occupancy' };
        };

        // Filter and sort clearances
        let filtered = PERMISSIONS_MASTER.map((perm, idx) => {
          const app = getAppForPermission(perm.id);
          const phase = getPermissionPhase(idx);
          return { ...perm, app, phase, originalIndex: idx };
        }).filter(item => {
          // Stage filter
          if (stageFilter !== 'ALL' && item.phase.id !== stageFilter) return false;
          
          // Status filter
          if (statusFilter !== 'ALL') {
            if (statusFilter === 'APPROVED' && item.app?.status !== 'APPROVED') return false;
            if (statusFilter === 'IN_REVIEW' && item.app?.status !== 'IN_REVIEW') return false;
            if (statusFilter === 'ACTION_REQUIRED' && item.app?.status !== 'ACTION_REQUIRED') return false;
            if (statusFilter === 'PENDING' && item.app) return false;
          }

          // Search query
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const name = (item.name || item.title || '').toLowerCase();
            const auth = (item.authority || '').toLowerCase();
            if (!name.includes(q) && !auth.includes(q)) return false;
          }

          return true;
        });

        // Sorting
        if (sortBy === 'SLA_FASTEST') {
          filtered.sort((a, b) => parseInt(a.slaDays || '30') - parseInt(b.slaDays || '30'));
        } else if (sortBy === 'AUTH') {
          filtered.sort((a, b) => a.authority.localeCompare(b.authority));
        }

        const totalPermissions = PERMISSIONS_MASTER.length;
        const projectApps = applications.filter(a => a.projectId === project.id);
        const approvedCount = projectApps.filter(a => a.status === 'Approved' || a.status === 'APPROVED').length;
        const inReviewCount = projectApps.filter(a => a.status === 'Under Review' || a.status === 'IN_REVIEW').length;
        const actionRequiredCount = projectApps.filter(a => a.status === 'ACTION_REQUIRED').length;
        const progressPercent = Math.round((approvedCount / totalPermissions) * 100);

        return (
          <div className="space-y-6 animate-fade-in pb-12">
            
            {/* Compact Decluttered Unit Summary Bar (Left: Profile, Right: Readiness) */}
            <div className="glass-panel rounded-2xl p-5 border border-indigo-500/25 bg-gradient-to-r from-slate-900 via-indigo-950/30 to-slate-900 grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
              
              {/* Unit Meta */}
              <div className="lg:col-span-7 space-y-2">
                <div className="flex items-center space-x-2">
                  <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                    ID: {project.id}
                  </span>
                  <span className="text-xs font-bold text-amber-300 bg-amber-500/15 border border-amber-500/30 px-2 py-0.5 rounded">
                    {project.category || 'Orange'} Category
                  </span>
                </div>

                <h1 className="text-xl sm:text-2xl font-black text-white font-heading">
                  {project.name}
                </h1>

                <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-300">
                  <div className="flex items-center space-x-1">
                    <Icons.MapPin className="w-3.5 h-3.5 text-rose-400" />
                    <span>{project.location}</span>
                  </div>
                  <div className="flex items-center space-x-1">
                    <Icons.Layers className="w-3.5 h-3.5 text-emerald-400" />
                    <span>{project.builtUpArea || project.landArea}</span>
                  </div>
                  <div className="text-amber-300 font-semibold">
                    Investment: {project.estimatedCost}
                  </div>
                </div>
              </div>

              {/* Readiness Progress Meter */}
              <div className="lg:col-span-5 bg-slate-950/70 rounded-xl p-4 border border-slate-800 space-y-2.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-300">Clearance Readiness</span>
                  <span className="font-mono font-bold text-indigo-400">{progressPercent}% Completed</span>
                </div>

                <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                  <div
                    className="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-full rounded-full transition-all duration-500"
                    style={{ width: `${progressPercent}%` }}
                  />
                </div>

                <div className="grid grid-cols-4 gap-1 text-center text-[10px] font-mono pt-1">
                  <div className="bg-emerald-500/10 rounded p-1 text-emerald-300 border border-emerald-500/20">
                    <span className="font-bold block text-xs">{approvedCount}</span>
                    <span>Approved</span>
                  </div>
                  <div className="bg-indigo-500/10 rounded p-1 text-indigo-300 border border-indigo-500/20">
                    <span className="font-bold block text-xs">{inReviewCount}</span>
                    <span>In Review</span>
                  </div>
                  <div className="bg-rose-500/10 rounded p-1 text-rose-300 border border-rose-500/20">
                    <span className="font-bold block text-xs">{actionRequiredCount}</span>
                    <span>Action</span>
                  </div>
                  <div className="bg-slate-800/60 rounded p-1 text-slate-400 border border-slate-700/60">
                    <span className="font-bold block text-xs">{totalPermissions - projectApps.length}</span>
                    <span>Pending</span>
                  </div>
                </div>
              </div>

            </div>

            {/* Sorting, Phase Filtering & Search Controls Bar */}
            <div className="space-y-3">
              <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                
                {/* Stage / Phase Tabs */}

          const stampDutySavings = (calcInvestment * 0.35 * 0.05) * stampDutyRate;

          const totalFiscalAid = totalSGST7Yrs + totalPower5Yrs + stampDutySavings;

          return {
            sgstPct: Math.round(sgstRate * 100),
            sgstTotal: totalSGST7Yrs.toFixed(1),
            powerRate: powerSubsidyRate.toFixed(2),
            powerTotal: totalPower5Yrs.toFixed(1),

                <div className="space-y-2">
                  <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
                    <Icons.Tag className="w-3.5 h-3.5 text-emerald-400" />
                    <span>Filter by Policy Category (Select Category):</span>
                  </span>
                  <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
