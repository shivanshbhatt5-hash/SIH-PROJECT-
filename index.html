                                    className="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 flex items-center space-x-1"
                                  >
                                    <Icons.Eye className="w-3.5 h-3.5" />
                                    <span>Inspect AI Pipeline</span>
                                  </button>
                                )}
                              </div>
                            </div>

                            {/* Live AI Verification Summary Badge & OCR Extraction */}
                            {isUploaded && v && (
                              <div className="p-3 rounded-lg bg-slate-950/70 border border-slate-800 space-y-2 text-xs">
                                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                                      🏷️ document_type: "{v.document_type}"
                                    </span>
                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                      v.decision === 'AUTO_APPROVED' 
                                        ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' 
                                        : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                                    }`}>
                                      {v.decision === 'AUTO_APPROVED' ? '✅ Auto-Approved' : '⚠️ Flagged for Review'} ({v.confidence_score}% Confidence)
                                    </span>
                                  </div>

                                  <span className="text-[10px] text-slate-400 font-mono">
                                    Cross-Check: {v.cross_document_consistency.plot_match ? '✓ Plot Match' : '✗ Plot Mismatch'}
                                  </span>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-[11px] font-mono text-slate-300">
                                  <div><span className="text-slate-500">Doc #:</span> <strong className="text-slate-200">{v.extracted_fields.document_number}</strong></div>
                                  <div><span className="text-slate-500">Plot:</span> <strong className="text-slate-200">{v.extracted_fields.plot_number}</strong></div>
                                  <div><span className="text-slate-500">Area:</span> <strong className="text-slate-200">{v.extracted_fields.area_sqft}</strong></div>
                                  <div><span className="text-slate-500">Issue:</span> <strong className="text-slate-200">{v.extracted_fields.issue_date}</strong></div>
                                  <div><span className="text-slate-500">Expiry:</span> <strong className="text-slate-200">{v.extracted_fields.expiry_date}</strong></div>
                                  <div><span className="text-slate-500">Authority:</span> <strong className="text-slate-200 truncate">{v.extracted_fields.authority_name ? v.extracted_fields.authority_name.split(' ')[0] : 'MIDC'}</strong></div>
                                </div>

                                {v.cross_document_consistency.discrepancies.length > 0 && (
                                  <div className="p-2 rounded bg-rose-950/40 border border-rose-500/30 text-[11px] text-rose-300 space-y-0.5">
                                    {v.cross_document_consistency.discrepancies.map((disc, dIdx) => (
                                      <div key={dIdx}>⚠️ {disc}</div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* STEP 3: Fee & Submit */}
                {step === 3 && (
                  <div className="space-y-4 animate-fade-in">
                    <div className="glass-card rounded-xl p-4 border border-slate-800 space-y-2 text-xs">
                      <div className="flex justify-between"><span>Scrutiny Fee</span><span className="font-mono">{permission.fee}</span></div>
                      <div className="flex justify-between"><span>SWCS Portal Fee</span><span className="font-mono">₹ 500</span></div>
                      <div className="flex justify-between font-bold border-t border-slate-800 pt-2 text-white"><span>Total Amount</span><span className="text-emerald-400 font-mono">{permission.fee}</span></div>
                    </div>
                    <label className="flex items-start space-x-2 text-xs text-slate-300">
                      <input type="checkbox" checked={undertakingAgreed} onChange={(e) => setUndertakingAgreed(e.target.checked)} className="mt-0.5" />
                      <span>I hereby declare that all uploaded blueprints, drawings, and certificates comply with statutory Maharashtra DCR & Factories norms.</span>
                    </label>
                  </div>
                )}
              </div>

              {/* Modal Footer */}
              <div className="flex justify-between px-6 py-4 border-t border-slate-800 bg-slate-950/60">
                {step > 1 ? <button onClick={() => setStep(step - 1)} className="px-4 py-2 bg-slate-800 rounded text-xs">Back</button> : <div />}
                {step < 3 ? (
                  <button onClick={() => setStep(step + 1)} className="px-4 py-2 bg-indigo-600 text-white rounded text-xs font-bold">Next Step</button>
                ) : (
                  <button onClick={handleSubmit} disabled={!undertakingAgreed || isSubmitting} className="px-5 py-2 bg-emerald-600 text-white rounded text-xs font-bold">
                    {isSubmitting ? 'Submitting...' : 'Pay & Submit Application'}
                  </button>
                )}
              </div>

              {/* --- EMBEDDED AI VERIFICATION & OCR INSPECTOR MODAL DRAWER --- */}
              {activeInspectIndex !== null && liveVerificationResult && (
                <div className="absolute inset-0 z-20 bg-slate-950/95 backdrop-blur-xl flex flex-col animate-fade-in">
                  
                  {/* Drawer Header */}
                  <div className="flex items-center justify-between px-6 py-3.5 border-b border-slate-800 bg-slate-900/80">
                    <div className="flex items-center space-x-2.5">
                      <div className="w-8 h-8 rounded-lg bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-300">
                        <Icons.Bot className="w-4 h-4" />
                      </div>
                      <div>
                        <h3 className="text-sm font-bold text-white">
                          AI Document Verification Pipeline & OCR Inspector
                        </h3>
                        <p className="text-[11px] text-slate-400">
                          {requiredDocuments[activeInspectIndex]} • {project.companyName}
                        </p>
                      </div>
                    </div>

                    <button
                      onClick={() => setActiveInspectIndex(null)}
                      className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700"
                    >
                      Done / Close Inspector
                    </button>
                  </div>

                  {/* Drawer Content */}
                  <div className="p-6 overflow-y-auto space-y-5 flex-1 text-xs">
                    
                    {/* Visual 7-Stage Pipeline Status Tracker */}
                    <div className="glass-panel p-4 rounded-xl border border-purple-500/30 space-y-3 bg-slate-900/60">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-purple-300">
                        End-to-End Automated Pipeline Status
                      </span>

                      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 text-center text-[10px] font-bold">
                        <div className="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300">
                          <div>1. Upload</div>
                          <div className="text-[9px] text-slate-400 font-normal mt-0.5">Completed</div>
                        </div>

                        <div className="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300">
                          <div>2. Classify</div>
                          <div className="text-[9px] text-emerald-400 font-mono mt-0.5">"{liveVerificationResult.document_type}"</div>
                        </div>

                        <div className="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300">
                          <div>3. OCR Extract</div>
                          <div className="text-[9px] text-slate-400 font-normal mt-0.5">6/6 Fields</div>
                        </div>

                        <div className={`p-2 rounded-lg border ${liveVerificationResult.field_validation.date_not_expired ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border-rose-500/30 text-rose-300'}`}>
                          <div>4. Rules</div>
                          <div className="text-[9px] font-normal mt-0.5">{liveVerificationResult.field_validation.date_not_expired ? 'Passed' : 'Date Expired'}</div>
                        </div>

                        <div className={`p-2 rounded-lg border ${liveVerificationResult.cross_document_consistency.plot_match ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border-rose-500/30 text-rose-300'}`}>
                          <div>5. Cross-Check</div>
                          <div className="text-[9px] font-normal mt-0.5">{liveVerificationResult.cross_document_consistency.plot_match ? 'Plot Matched' : 'Discrepancy'}</div>
                        </div>

                        <div className="p-2 rounded-lg bg-indigo-500/10 border border-indigo-500/30 text-indigo-300">
                          <div>6. Confidence</div>
                          <div className="text-[9px] font-mono mt-0.5">{liveVerificationResult.confidence_score}%</div>
                        </div>

                        <div className={`p-2 rounded-lg border ${liveVerificationResult.decision === 'AUTO_APPROVED' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-amber-500/20 border-amber-500/40 text-amber-300'}`}>
                          <div>7. Decision</div>
                          <div className="text-[9px] font-bold mt-0.5">{liveVerificationResult.decision === 'AUTO_APPROVED' ? 'Auto-Approve' : 'Flag Review'}</div>
                        </div>
                      </div>
                    </div>

                    {/* Interactive OCR Playground & Test Presets */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                      
                      {/* Left: Text Input / Presets */}
                      <div className="lg:col-span-6 space-y-3">
                        <div className="flex items-center justify-between">
                          <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                            <Icons.FileText className="w-3.5 h-3.5 text-indigo-400" />
                            <span>Extracted Document Text (OCR Feed)</span>
                          </label>
                          <span className="text-[10px] text-slate-400 font-mono">Editable</span>
                        </div>

                        {/* Presets */}
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="text-[10px] text-slate-400 font-semibold">Test Presets:</span>
                          <button onClick={() => applyPreset('valid_bp')} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-200 border border-slate-700">Valid Building Plan</button>
                          <button onClick={() => applyPreset('valid_fire')} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-200 border border-slate-700">Valid Fire NOC</button>
                          <button onClick={() => applyPreset('plot_mismatch')} className="px-2 py-1 rounded bg-amber-950/40 hover:bg-amber-900/50 text-[10px] text-amber-300 border border-amber-500/30">Plot Mismatch</button>
                          <button onClick={() => applyPreset('expired')} className="px-2 py-1 rounded bg-rose-950/40 hover:bg-rose-900/50 text-[10px] text-rose-300 border border-rose-500/30">Expired Document</button>
                        </div>

                        <textarea
                          rows={10}
                          value={editableOCRText}
                          onChange={(e) => setEditableOCRText(e.target.value)}
                          className="w-full glass-input rounded-xl p-3 font-mono text-[11px] text-slate-200 leading-relaxed border border-slate-700"
                          placeholder="Paste or type extracted OCR document text here..."
                        />

                        <button
                          type="button"
                          onClick={handleRerunVerification}
                          className="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 text-white font-bold text-xs shadow-md flex items-center justify-center space-x-2"
                        >
                          <Icons.Bot className="w-4 h-4" />
                          <span>Re-Run AI Verification Pipeline</span>
                        </button>
                      </div>

                      {/* Right: Structured Extraction & JSON Result */}
                      <div className="lg:col-span-6 space-y-3">
                        <div className="flex items-center justify-between">
                          <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
                            <Icons.CheckCircle2 className="w-3.5 h-3.5 text-emerald-400" />
                            <span>Structured AI Extraction & Verification JSON</span>
                          </label>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            liveVerificationResult.decision === 'AUTO_APPROVED' 
                              ? 'bg-emerald-500/20 text-emerald-300' 
                              : 'bg-amber-500/20 text-amber-300'
                          }`}>
                            {liveVerificationResult.decision}
                          </span>
                        </div>

                        <div className="glass-card rounded-xl p-3.5 border border-slate-800 bg-slate-950 font-mono text-[11px] text-emerald-400 overflow-x-auto max-h-[330px]">
                          <pre>{JSON.stringify(liveVerificationResult, null, 2)}</pre>
                        </div>

                        {liveVerificationResult.cross_document_consistency.discrepancies.length > 0 && (
                          <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-500/40 space-y-1">
                            <span className="font-bold text-rose-300 block text-[11px]">Flagged Discrepancies:</span>
                            {liveVerificationResult.cross_document_consistency.discrepancies.map((d, i) => (
                              <p key={i} className="text-[11px] text-rose-200 leading-snug">• {d}</p>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>

                  </div>
                </div>
              )}

            </div>

          </div>
        );
      }

      // Application Details & Timeline Tracker Modal
      function ApplicationDetailModal({ application, permission, onClose, onOpenCertificateModal, onRespondQuery }) {
        const [responseText, setResponseText] = useState('');

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
            <div className="glass-panel border border-slate-700/80 rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl bg-slate-900/95 flex flex-col max-h-[90vh]">
              <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/60">
                <div>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">{application.authority}</span>
                  <h2 className="text-lg font-bold text-white mt-1">{application.permissionTitle} Details</h2>
                </div>
                <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-white"><Icons.X className="w-5 h-5" /></button>
              </div>

              <div className="p-6 overflow-y-auto space-y-6 flex-1">
                {application.status === 'ACTION_REQUIRED' && (
                  <div className="p-4 rounded-xl bg-rose-950/40 border border-rose-500/40 space-y-3">
                    <div className="flex items-center space-x-2 text-rose-300 font-bold text-xs">
                      <Icons.AlertCircle className="w-4 h-4 text-rose-400" />
                      <span>Department Query Raised by Officer</span>
                    </div>
                    <p className="text-xs text-rose-200 bg-rose-900/30 p-3 rounded">{application.queryMessage}</p>
                    <form onSubmit={(e) => { e.preventDefault(); onRespondQuery(application.id, responseText); }} className="space-y-2">
                      <textarea placeholder="Type clarification response..." value={responseText} onChange={(e) => setResponseText(e.target.value)} className="w-full glass-input rounded p-2 text-xs" />
                      <button type="submit" className="px-4 py-2 bg-rose-600 text-white rounded text-xs font-bold">Submit Clarification to Officer</button>
                    </form>
                  </div>
                )}

                <div className="space-y-3">
                  <h3 className="text-xs font-bold text-white uppercase">Processing Timeline</h3>
                  <div className="relative pl-6 space-y-4 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-800">
                    {application.timeline.map((item, idx) => (
                      <div key={idx} className="relative flex items-start space-x-3 text-xs">
                        <div className="absolute -left-6 top-0.5 w-5 h-5 rounded-full bg-indigo-500 text-white text-[10px] flex items-center justify-center font-mono">
                          {idx + 1}
                        </div>
                        <div className="glass-card rounded-xl p-3 border border-slate-800 flex-1">
                          <div className="flex justify-between font-bold text-slate-200">
                            <span>{item.step}</span>
                            <span className="font-mono text-[10px] text-slate-400">{item.date}</span>
                          </div>
                          <p className="text-slate-400 text-[11px] mt-1">{item.note}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex justify-between px-6 py-4 border-t border-slate-800">
                <button onClick={onClose} className="px-4 py-2 bg-slate-800 rounded text-xs">Close</button>
                {application.status === 'APPROVED' && (
                  <button onClick={() => onOpenCertificateModal(application, permission)} className="px-4 py-2 bg-emerald-600 text-white rounded text-xs font-bold">View Issued NOC</button>
                )}
              </div>
            </div>

          </div>
        );
      }

      // Official Scrutiny & Review Workbench Modal
      function OfficialReviewModal({ application, permission, onClose, onUpdateAppStatus }) {
        const [actionType, setActionType] = useState('APPROVE');
        const [officerRemarks, setOfficerRemarks] = useState('');

        const handleAction = () => {
          if (actionType === 'APPROVE') {
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
            onUpdateAppStatus({
              ...application,
              status: 'APPROVED',
              remarks: officerRemarks || "Building plan verified against DCR regulations. Statutory NOC granted.",
              issuedCertificateId: `${application.authority.replace(' ', '')}/NOC/2026/${Math.floor(10000 + Math.random() * 90000)}`,
              issuedDate: new Date().toISOString().split('T')[0],
              timeline: [
                ...application.timeline,
                { step: "Statutory Approval Granted", date: new Date().toLocaleString(), status: "completed", note: "Certificate Issued." }
              ]
            });
          } else if (actionType === 'QUERY') {
            onUpdateAppStatus({
              ...application,
              status: 'ACTION_REQUIRED',
              queryMessage: officerRemarks || "Please clarify effluent treatment flow rate and submit updated layout.",
              timeline: [
                ...application.timeline,
                { step: "Clarification Query Raised", date: new Date().toLocaleString(), status: "action", note: officerRemarks }
              ]
            });
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
            <div className="glass-panel border border-slate-700/80 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl bg-slate-900/95 flex flex-col max-h-[92vh]">
              <div className="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/60">
                <h2 className="text-lg font-bold text-white font-heading">{application.authority} Scrutiny Workbench - {application.projectName}</h2>
                <button onClick={onClose} className="p-2 text-slate-400 hover:text-white"><Icons.X className="w-5 h-5" /></button>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 flex-1 overflow-hidden p-6 gap-6">
                <div className="lg:col-span-7 space-y-4 border-r border-slate-800 pr-6 overflow-y-auto">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-bold uppercase text-slate-300">Submitted CAD & Statutory Attachments ({application.uploadedFiles.length})</h3>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">AI Verification Active</span>
                  </div>

                  {application.uploadedFiles.map((f, i) => {
                    const v = f.aiVerification;
                    return (
                      <div key={i} className={`p-3.5 rounded-xl border text-xs space-y-2.5 ${
                        v?.decision === 'AUTO_APPROVED' ? 'bg-slate-950 border-emerald-500/40' : 'bg-slate-950 border-amber-500/40'
                      }`}>
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="font-bold text-slate-200">{f.name}</p>
                            <p className="text-[10px] text-slate-400">{f.size} • Uploaded {f.date || 'Today'}</p>
                          </div>
                          {v ? (
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                              v.decision === 'AUTO_APPROVED' ? 'badge-approved' : 'badge-pending'
                            }`}>
                              {v.decision === 'AUTO_APPROVED' ? '✓ AI Auto-Verified' : '⚠️ Flagged for Review'} ({v.confidence_score}%)
                            </span>
                          ) : (
                            <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 rounded text-[10px]">Verified</span>
                          )}
                        </div>

                        {v && (
                          <div className="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800/80 space-y-1.5 text-[11px]">
                            <div className="flex items-center justify-between text-[10px]">
                              <span className="font-mono text-purple-300 font-semibold">AI Classified: <strong className="text-white">"{v.document_type}"</strong></span>
                              <span className="font-mono text-slate-400">Rules: {v.field_validation.date_not_expired ? '✓ Valid' : '✗ Expired'}</span>
                            </div>

                            <div className="grid grid-cols-2 gap-x-2 gap-y-1 font-mono text-[10px] text-slate-300">
                              <div><span className="text-slate-500">Doc No:</span> {v.extracted_fields.document_number}</div>
                              <div><span className="text-slate-500">Plot No:</span> {v.extracted_fields.plot_number}</div>
                              <div><span className="text-slate-500">Area:</span> {v.extracted_fields.area_sqft}</div>
                              <div><span className="text-slate-500">Validity:</span> {v.extracted_fields.expiry_date}</div>
                            </div>

                            {v.cross_document_consistency.discrepancies.length > 0 && (
                              <div className="p-1.5 rounded bg-rose-950/60 border border-rose-500/30 text-[10px] text-rose-300">
                                {v.cross_document_consistency.discrepancies.map((d, dIdx) => (
                                  <div key={dIdx}>⚠️ {d}</div>
                                ))}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <div className="h-48 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-center p-4 text-xs text-slate-400">
                    Architectural vector drawings & setback geometry verified against DCR zoning rules.
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-4 flex flex-col justify-between">
                  <div className="space-y-3">
                    <h3 className="text-xs font-bold uppercase text-emerald-400">Select Department Action</h3>
                    <div className="grid grid-cols-2 gap-2 text-xs font-semibold">
                      <button onClick={() => setActionType('APPROVE')} className={`p-2.5 rounded-xl border ${actionType === 'APPROVE' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500' : 'bg-slate-900 border-slate-800'}`}>✓ Approve NOC</button>
                      <button onClick={() => setActionType('QUERY')} className={`p-2.5 rounded-xl border ${actionType === 'QUERY' ? 'bg-rose-500/20 text-rose-300 border-rose-500' : 'bg-slate-900 border-slate-800'}`}>? Raise Query</button>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Official Remarks / Query Note</label>
                      <textarea rows={4} placeholder="Enter scrutiny remarks..." value={officerRemarks} onChange={(e) => setOfficerRemarks(e.target.value)} className="w-full glass-input rounded p-3 text-xs" />
                    </div>
                  </div>

                  <button onClick={handleAction} className={`w-full py-3 rounded-xl font-bold text-xs text-white ${actionType === 'APPROVE' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                    {actionType === 'APPROVE' ? 'Grant Statutory NOC' : 'Transmit Query to Industrialist'}
                  </button>
                </div>
              </div>
            </div>

          </div>
        );
      }

      // Certificate Modal

        ];

          setSearched(true);
          const q = searchQuery.trim().toLowerCase();
          if (!q) {
            setSearchResult(null);
            return;
          }
          const found = applications.find(a => 
            a.id.toLowerCase().includes(q) || 
            (a.projectName && a.projectName.toLowerCase().includes(q)) ||
            (a.companyName && a.companyName.toLowerCase().includes(q)) ||
            (a.plotNumber && a.plotNumber.toLowerCase().includes(q))
          );
          setSearchResult(found || null);
        };

        // Fee calculation logic
        const estimatedFee = Math.round((plotAreaSqft * 1.5) + (sectorCategory === 'Red' ? 45000 : sectorCategory === 'Orange' ? 30000 : 15000));
        const estimatedDays = sectorCategory === 'Red' ? '21-30 Days' : sectorCategory === 'Orange' ? '15-21 Days' : sectorCategory === 'Green' ? '10-15 Days' : '5-7 Days';

        return (
          <div className="space-y-8 animate-fade-in relative z-10">

                </p>
              </div>

                <div className="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                  <span className="text-slate-400 block text-[10px]">Zero Pendency Index</span>
                  <span className="text-emerald-400 font-bold text-sm">98.8% Under SLA</span>
                </div>
              </div>
            </div>

            {/* Section 1: Public Application & Plot Tracker */}

                <Icons.Search className="w-5 h-5 text-cyan-400" />

              </div>
              <p className="text-xs text-slate-400">
                Enter your Statutory Application Reference ID (e.g., <code className="text-cyan-300">APP-MIDC-2026-001</code>) or Plot Number to view live processing status.
              </p>

              <form onSubmit={handleSearch} className="flex flex-col sm:flex-row gap-3">
                <div className="relative flex-1">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search by Application ID (e.g. APP-MIDC-2026-001) or Plot No (A-42)..."
                    className="w-full glass-input rounded-xl px-4 py-3 text-xs text-white"
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => { setSearchQuery(''); setSearched(false); setSearchResult(null); }}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  )}
                </div>
                <button
                  type="submit"
                  className="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center space-x-2"
                >
                  <Icons.Search className="w-4 h-4" />
                  <span>Track Status</span>
                </button>
              </form>

              {/* Quick sample chips */}
              <div className="flex flex-wrap items-center gap-2 pt-1 text-[11px] text-slate-400">
                <span>Try sample query:</span>
                <button
                  onClick={() => { setSearchQuery('APP-MIDC-2026-001'); setTimeout(() => handleSearch(), 50); }}
                  className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono"
                >
                  APP-MIDC-2026-001 (Approved)
                </button>
                <button
                  onClick={() => { setSearchQuery('APP-FIRE-2026-003'); setTimeout(() => handleSearch(), 50); }}
                  className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 font-mono"
                >
                  APP-FIRE-2026-003 (Query Raised)
                </button>
                <button
                  onClick={() => { setSearchQuery('A-42'); setTimeout(() => handleSearch(), 50); }}
                  className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-indigo-300 font-mono"
                >
                  Plot No. A-42
                </button>
              </div>

              {/* Tracker Result Display */}
              {searched && (
                <div className="mt-4 pt-4 border-t border-slate-800 animate-fade-in">
                  {searchResult ? (
                    <div className="p-4 rounded-xl bg-slate-900/90 border border-slate-700/80 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="font-mono text-xs font-bold text-cyan-300">{searchResult.id}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                              searchResult.status === 'APPROVED' ? 'badge-approved' :
                              searchResult.status === 'ACTION_REQUIRED' ? 'badge-action' : 'badge-pending'
                            }`}>
                              {searchResult.status.replace('_', ' ')}
                            </span>
                          </div>
                          <h3 className="font-bold text-white text-sm mt-1">{searchResult.projectName}</h3>
                          <p className="text-xs text-slate-400">{searchResult.authority} • {searchResult.companyName}</p>
                        </div>

                        <div className="text-right">
                          <span className="text-[10px] text-slate-400 block">Statutory SLA Window</span>
                          <span className="text-xs font-bold text-indigo-300">{searchResult.slaDays} Days</span>
                        </div>
                      </div>

                      {/* Timeline steps */}
                      <div className="space-y-2">
                        <span className="text-[11px] font-bold uppercase text-slate-400">Processing Audit Trail:</span>
                        <div className="space-y-2">
                          {searchResult.timeline.map((t, idx) => (
                            <div key={idx} className="flex items-start space-x-3 text-xs">
                              <span className="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center text-[10px] font-mono shrink-0">
                                {idx + 1}
                              </span>
                              <div className="flex-1">
                                <div className="flex justify-between">
                                  <span className="font-semibold text-slate-200">{t.step}</span>
                                  <span className="text-slate-500 font-mono text-[10px]">{t.date}</span>
                                </div>
                                <p className="text-slate-400 text-[11px]">{t.note}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="p-6 text-center text-slate-400 bg-slate-900/50 rounded-xl border border-dashed border-slate-800">
                      <Icons.AlertCircle className="w-8 h-8 text-amber-400 mx-auto mb-2" />
                      <p className="text-xs font-semibold text-white">No statutory application matched "{searchQuery}"</p>
                      <p className="text-[11px] text-slate-500 mt-1">Please check your Application ID or Plot Number and try again.</p>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Section 2: Statewide Industrial Parks SLA Compliance Matrix */}
            <div className="glass-card card-animated rounded-2xl p-6 border border-slate-800 space-y-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <Icons.Activity className="w-5 h-5 text-indigo-400" />
                  <h2 className="text-base font-bold text-white font-heading">Statewide Industrial Park Clearance SLA Matrix</h2>
                </div>
                <span className="text-[11px] text-slate-400 font-mono">Live Sync: Maharashtra GIS</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400 font-semibold text-[11px]">
                      <th className="py-3 px-3">Industrial Park / MIDC Zone</th>
                      <th className="py-3 px-3">District</th>
                      <th className="py-3 px-3 text-center">Clearances Issued</th>
                      <th className="py-3 px-3 text-center">Avg Processing SLA</th>
                      <th className="py-3 px-3 text-center">On-Time SLA %</th>
                      <th className="py-3 px-3 text-right">Performance</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {industrialParks.map((park, i) => (
                      <tr key={i} className="hover:bg-slate-800/40 transition-colors">
                        <td className="py-3 px-3 font-bold text-white flex items-center space-x-2">
                          <Icons.MapPin className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                          <span>{park.name}</span>
                        </td>
                        <td className="py-3 px-3 text-slate-300">{park.district}</td>
                        <td className="py-3 px-3 text-center font-mono text-slate-200">{park.clearances}</td>
                        <td className="py-3 px-3 text-center font-mono text-indigo-300 font-bold">{park.avgDays}</td>
                        <td className="py-3 px-3 text-center font-mono text-emerald-400 font-bold">{park.slaRate}</td>
                        <td className="py-3 px-3 text-right">
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                            {park.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Section 3: Interactive Fee & Timeline Estimator */}
            <div className="glass-card card-animated rounded-2xl p-6 border border-slate-800 space-y-4">
              <div className="flex items-center space-x-2">
                <Icons.DollarSign className="w-5 h-5 text-amber-400" />
                <h2 className="text-base font-bold text-white font-heading">Interactive Statutory Fee & Timeline Estimator</h2>
              </div>
              <p className="text-xs text-slate-400">
                Estimate required government scrutiny fees and anticipated approval turnaround days based on CPCB industrial categorization.
              </p>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                <div className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-300 font-semibold block mb-1.5">CPCB Industry Category</label>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      {['Red', 'Orange', 'Green', 'White'].map((cat) => (
                        <button
                          key={cat}
                          type="button"
                          onClick={() => setSectorCategory(cat)}
                          className={`py-2 px-3 rounded-xl text-xs font-bold transition-all border ${
                            sectorCategory === cat
                              ? cat === 'Red' ? 'bg-rose-600 text-white border-rose-400' :
                                cat === 'Orange' ? 'bg-amber-600 text-white border-amber-400' :
                                cat === 'Green' ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-200 text-slate-900 border-white'
                              : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                          }`}
                        >
                          {cat} Category
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between text-xs text-slate-300 font-semibold mb-1.5">
                      <span>Total Built-Up Area (sq.ft)</span>
                      <span className="font-mono text-cyan-300">{plotAreaSqft.toLocaleString()} sq.ft</span>
                    </div>
                    <input
                      type="range"
                      min="5000"
                      max="200000"
                      step="5000"
                      value={plotAreaSqft}
                      onChange={(e) => setPlotAreaSqft(Number(e.target.value))}
                      className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500"
                    />
                    <div className="flex justify-between text-[10px] text-slate-500 mt-1">
                      <span>5,000 sq.ft</span>
                      <span>100,000 sq.ft</span>
                      <span>200,000 sq.ft</span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/80 rounded-xl p-5 border border-slate-700/80 flex flex-col justify-between space-y-4">
                  <div>
                    <span className="text-[10px] font-mono text-slate-400 uppercase">Estimated Statutory Calculation</span>
                    <div className="mt-2 flex items-baseline space-x-2">
                      <span className="text-2xl sm:text-3xl font-black text-amber-300 font-heading">₹{estimatedFee.toLocaleString()}</span>
                      <span className="text-xs text-slate-400">approx. combined fees</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800">
                    <div>
                      <span className="text-[10px] text-slate-400 block">Estimated SLA Turnaround</span>
                      <span className="text-xs font-bold text-indigo-300 font-mono">{estimatedDays}</span>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 block">Single Window Scheme</span>
                      <span className="text-xs font-bold text-emerald-400">RTS Act Mandated</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>


          </div>
        );
      }

      // ==========================================
      // PORTAL 4: AI VERIFICATION OPERATIONS CENTER
      // ==========================================

      function AIOperationsPortal({ project, applications }) {
        const [sampleIndex, setSampleIndex] = useState(0);
        const [testText, setTestText] = useState(generateSampleOCRText('MIDC Building Plan Approval', 'building_plan'));
        const [isVerifying, setIsVerifying] = useState(false);
        const [pipelineResult, setPipelineResult] = useState(() => runDocumentVerificationPipeline(testText, 'MIDC Building Plan Approval', project));

        const presets = [
          {
            name: "Valid Building Plan (Auto-Approve 96%)",
            type: "building_plan",
            docName: "MIDC Sanctioned Building Plan",
            text: `MAHARASHTRA INDUSTRIAL DEVELOPMENT CORPORATION (MIDC)
Sanction Order & Building Plan Approval
Plan Approval No: MIDC/BP/2026/A42/089
Date of Issue: 15/02/2026
Plot No: Plot No. A-42, Chakan Industrial Area Phase II, Pune
Applicant: Apex Auto Components Pvt Ltd
Total Built-up Area: 45,000 sq.ft
Issued by: MIDC Planning Authority, Pune Division
Status: Sanctioned under DCR Regulations`
          },
          {
            name: "Plot Mismatch (Flagged for Review 55%)",
            type: "building_plan",
            docName: "MIDC Building Plan (Wrong Plot)",
            text: `MAHARASHTRA INDUSTRIAL DEVELOPMENT CORPORATION (MIDC)
Plan Approval No: MIDC/BP/2026/B99/042
Date of Issue: 10/01/2026
Plot No: Plot No. B-99, Talegaon Industrial Park
Applicant: Apex Auto Components Pvt Ltd
Total Built-up Area: 52,000 sq.ft
Issued by: MIDC Planning Authority`
          },
          {
            name: "Valid Fire NOC (Auto-Approve 94%)",
            type: "fire_noc",
            docName: "Provisional Fire NOC",
            text: `MAHARASHTRA FIRE SERVICES / MIDC FIRE BRIGADE
Provisional Fire Safety No Objection Certificate (NOC)
NOC Reference: FIRE/MIDC/PN/2026/0412
Issue Date: 20/01/2026
Valid Upto: 19/01/2027
Authority: MIDC Fire Services, Chakan Fire Station
Industrial Unit: Apex Auto Components Pvt Ltd
Plot Details: Plot No. A-42, Chakan Industrial Area Phase II
Compliance: NFPA 101, National Building Code Part IV`
          },
          {
            name: "Expired PCB Consent (Flagged for Review 45%)",
            type: "pcb_consent",
            docName: "MPCB Consent to Operate (Expired)",
            text: `MAHARASHTRA POLLUTION CONTROL BOARD (MPCB)
Consent to Operate under Section 25/26 of Water Act
Consent No: MPCB/RO-PUNE/CONSENT/2021/098
Date of Issue: 10/05/2021
Validity Period: Expired on 30/04/2023
Authority: Maharashtra Pollution Control Board
Industry: Apex Auto Components Pvt Ltd, Plot No. A-42`
          }
        ];

        const handleLoadPreset = (preset, idx) => {
          setSampleIndex(idx);
          setTestText(preset.text);
          setIsVerifying(true);
          setTimeout(() => {
            const res = runDocumentVerificationPipeline(preset.text, preset.docName, project);
            setPipelineResult(res);
            setIsVerifying(false);
          }, 350);
        };

        const handleReRun = () => {
          setIsVerifying(true);
          setTimeout(() => {
            const res = runDocumentVerificationPipeline(testText, "Custom Document", project);
            setPipelineResult(res);
            setIsVerifying(false);
          }, 350);
        };

        const pipelineStages = [
          { step: "1. Upload", desc: "Digital Ingestion & Format Check", status: "complete" },
          { step: "2. AI Classification", desc: "12 Statutory Document Types", status: "complete", tag: pipelineResult.document_type },
          { step: "3. OCR Extraction", desc: "6 Key Statutory Metadata Fields", status: "complete" },
          { step: "4. Field Validation", desc: "Date Sanity & Authority Rules", status: pipelineResult.anomalies.some(a => a.includes('date') || a.includes('Expired')) ? 'flag' : 'complete' },
          { step: "5. Cross-Doc Check", desc: "Plot No. & Entity Match", status: pipelineResult.anomalies.some(a => a.includes('Plot') || a.includes('Applicant')) ? 'flag' : 'complete' },
          { step: "6. Confidence Score", desc: `${pipelineResult.confidence_score}% Confidence Calculated`, status: "complete" },
          { step: "7. Decision", desc: pipelineResult.decision === 'AUTO_APPROVED' ? 'Auto-Approved' : 'Flagged for Review', status: pipelineResult.decision === 'AUTO_APPROVED' ? 'approved' : 'flag' },
        ];

        return (
          <div className="space-y-8 animate-fade-in relative z-10">
            
            {/* Header */}
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono bg-rose-500/20 text-rose-300 border border-rose-500/30">
                    LAYER 1 • AI VERIFICATION OPERATIONS
                  </span>
                  <span className="text-xs text-slate-400">Autonomous OCR & Rule Engine</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black text-white font-heading mt-1">
                  AI Autonomous Document Verification Center
                </h1>
                <p className="text-xs text-slate-400 mt-1">
                  Real-time 7-stage pipeline monitoring, OCR classification into 12 document categories, cross-document consistency checks, and auto-approval governance.
                </p>
              </div>

              <div className="flex items-center space-x-3">
                <div className="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                  <span className="text-slate-400 block text-[10px]">Auto-Approval Rate</span>
                  <span className="text-rose-400 font-bold text-sm">84.6% Automated</span>
                </div>
              </div>
            </div>

            {/* 7-Stage Pipeline Flow Visualizer */}
            <div className="glass-card card-animated rounded-2xl p-6 border border-slate-800 space-y-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <Icons.Cpu className="w-5 h-5 text-rose-400" />
                  <h2 className="text-base font-bold text-white font-heading">7-Stage Autonomous Pipeline Architecture</h2>
                </div>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  Pipeline Active
                </span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 pt-2">
                {pipelineStages.map((st, idx) => (
                  <div key={idx} className="p-3 rounded-xl bg-slate-900/90 border border-slate-800 flex flex-col justify-between space-y-2 relative overflow-hidden">
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-mono font-bold text-slate-400">Stage {idx + 1}</span>
                        {st.status === 'approved' ? (
                          <Icons.CheckCircle2 className="w-3.5 h-3.5 text-emerald-400" />
                        ) : st.status === 'flag' ? (
                          <Icons.AlertCircle className="w-3.5 h-3.5 text-amber-400" />
                        ) : (
                          <Icons.Check className="w-3.5 h-3.5 text-indigo-400" />
                        )}
                      </div>
                      <p className="text-xs font-bold text-white mt-1">{st.step}</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">{st.desc}</p>
                    </div>

                    {st.tag && (
                      <span className="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-mono text-[9px] truncate">
                        {st.tag}
                      </span>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Interactive OCR Playground */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: OCR Text Sandbox */}
              <div className="lg:col-span-6 glass-card card-animated rounded-2xl p-6 border border-slate-800 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white font-heading">Interactive OCR Document Text Sandbox</h3>
                  <button
                    onClick={handleReRun}
                    disabled={isVerifying}
                    className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center space-x-1.5 shadow"
                  >
                    <Icons.RefreshCw className={`w-3.5 h-3.5 ${isVerifying ? 'animate-spin' : ''}`} />
                    <span>Run Verification</span>
                  </button>
                </div>

                {/* Preset Chips */}
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1.5">Load Test Preset:</span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {presets.map((p, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleLoadPreset(p, idx)}
                        className={`p-2 rounded-xl text-left text-xs transition-all border ${
                          sampleIndex === idx
                            ? 'bg-indigo-950/60 border-indigo-500/60 text-white shadow'
                            : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800/80 hover:text-slate-200'
                        }`}
                      >
                        <div className="font-semibold truncate">{p.name}</div>
                        <div className="text-[10px] text-slate-500 font-mono">{p.type}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Textarea with active scanner */}
                <div className="relative rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
                  {isVerifying && <div className="laser-scanner-active"></div>}
                  <textarea
                    rows="9"
                    value={testText}
                    onChange={(e) => setTestText(e.target.value)}
                    className="w-full bg-slate-950/90 text-slate-200 font-mono text-xs p-3.5 focus:outline-none focus:ring-1 focus:ring-indigo-500 resize-none"
                    placeholder="Paste extracted document OCR text..."
                  ></textarea>
                </div>
              </div>

              {/* Right Column: AI Extraction & Verification Output */}
              <div className="lg:col-span-6 glass-card card-animated rounded-2xl p-6 border border-slate-800 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[10px] font-mono text-slate-400 block">AI Verification Decision</span>
                    <div className="flex items-center space-x-2 mt-0.5">
                      <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                        pipelineResult.decision === 'AUTO_APPROVED' ? 'badge-approved' : 'badge-pending'
                      }`}>
                        {pipelineResult.decision === 'AUTO_APPROVED' ? 'AUTO-APPROVED' : 'FLAGGED FOR REVIEW'}
                      </span>
                      <span className="font-mono text-xs text-indigo-300 font-bold">{pipelineResult.confidence_score}% Confidence</span>
                    </div>
                  </div>

                  <div className="text-right">
                    <span className="text-[10px] font-mono text-slate-400 block">Classified Document Type</span>
                    <span className="font-mono text-xs font-bold text-white bg-slate-800 px-2.5 py-1 rounded border border-slate-700 inline-block mt-0.5">
                      {pipelineResult.document_type}
                    </span>
                  </div>
                </div>

                {/* Extracted 6 statutory fields */}
                <div className="space-y-2">
                  <span className="text-xs font-bold uppercase text-slate-300">Extracted Statutory Fields (6 Key Rules):</span>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Document Number</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.document_number || 'N/A'}</span>
                    </div>
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Issue Date</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.issue_date || 'N/A'}</span>
                    </div>
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Expiry Date</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.expiry_date || 'Permanent'}</span>
                    </div>
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Authority Name</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.authority_name || 'N/A'}</span>
                    </div>
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Plot Number</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.plot_number || 'N/A'}</span>
                    </div>
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <span className="text-[10px] text-slate-500 block">Built-up Area</span>
                      <span className="font-mono text-slate-200 font-bold truncate block">{pipelineResult.extracted_fields?.area_sqft ? `${pipelineResult.extracted_fields.area_sqft} sq.ft` : 'N/A'}</span>
                    </div>
                  </div>
                </div>

      function generateAIAnswer(query, context = {}) {

        // 1. Greetings & Identity
        if (q.match(/^(hi|hello|hey|namaste|greetings|who are you|what can you do|help)/)) {

            suggestions: [
              "What are the 8 Major Permissions?",
              "What documents are needed before factory establishment?",
              "How does AI Document Verification work?",
              "What are the rules for Orange Category industry?"
            ]
          };
        }

        // 2. 8 Major Permissions

            suggestions: [
              "Documents required for Building Plan",
              "How to apply for Fire NOC?",
              "Water Connection approval process",
              "Plinth completion checklist"
            ]
          };
        }

        // 3. Building Plan
        if (q.includes('building plan') || q.includes('cad drawing') || q.includes('sanction order')) {
          return {
            text: "### 📐 Building Plan Approval (Rule 3 & DCR Norms)\n\n**Authority:** MIDC Planning Authority\n**SLA Timeline:** 14 Working Days\n**Statutory Scrutiny Fee:** ₹1.50 per sq.ft of built-up area\n\n**Mandatory Documents Required:**\n- Detailed Architectural CAD Layout & Floor Plans (DWG/DXF + PDF)\n- Structural Stability Certificate from Chartered Structural Engineer\n- Boundary Demarcation & Contour Survey\n- Copy of Allotment Letter & Possession Receipt\n- Soil Bearing Capacity Test Report\n\n💡 **AI Verification Tip:** Ensure your document explicitly specifies your **Plot Number** (`" + project.plotNumber + "`) and total built-up area. Our AI auto-approves building plans with ≥ 90% consistency.",
            suggestions: [
              "What is Plinth Completion?",
              "How to apply for Building Plan?",
              "What are DCR bye-laws?"
            ]
          };
        }

        // 4. Pre-Establishment Documents
        if (q.includes('pre establishment') || q.includes('pre-establishment') || q.includes('before establishment') || q.includes('before construction') || q.includes('pre industry')) {
          return {
            text: "### 📁 Pre-Establishment Documents (10 Key Approvals)\n\nThese 10 statutory approvals must be obtained **BEFORE breaking ground**:\n\n1. **IEM Part A** — Ministry of Commerce & Industry / Udyog Aadhar\n2. **MSME / Udyam Registration** — Ministry of MSME\n3. **MPCB Consent to Establish (CTE)** — Maharashtra Pollution Control Board\n4. **DISH Factory Plan Approval** — Directorate of Industrial Safety & Health (Rule 3)\n5. **Provisional Fire NOC** — MIDC Fire Services\n6. **PWD Electrical Inspector Approval** — Transformer, Substation & HT Panel drawings\n7. **GST Registration Certificate** — GST Department\n8. **Shops & Establishments Registration** — Department of Labour\n9. **Trade License / Factory Permit** — Local Municipal Body / Gram Panchayat\n10. **Environmental Clearance (EC)** — MoEFCC / SEIAA (Only for EIA Schedule projects)\n\nYou can view and download checklists for all 10 in the **Pre Industry Establishment** section.",
            suggestions: [
              "What is MPCB CTE?",
              "What is DISH Rule 3?",
              "What documents are needed post-establishment?"
            ]
          };
        }

        // 5. Post-Establishment Documents
        if (q.includes('post establishment') || q.includes('post-establishment') || q.includes('after construction') || q.includes('before operation') || q.includes('post industry')) {
          return {
            text: "### ✅ Post-Establishment Documents (9 Key Clearances)\n\nThese clearances are required **AFTER construction** and **BEFORE starting commercial manufacturing**:\n\n1. **IEM Part B** — Intimation of Commercial Production to MSME\n2. **MPCB Consent to Operate (CTO)** — Validated under Water & Air Acts\n3. **DISH Building Stability Certificate** — From approved Competent Person\n4. **DISH Factory License** — Valid factory operating permit under Factories Act 1948\n5. **CHWTSDF Membership** — Common Hazardous Waste Storage & Disposal Facility\n6. **CETP Membership** — Common Effluent Treatment Plant linkage (if water polluting)\n7. **Final Fire NOC** — On-site physical inspection & fire hydrant trial\n8. **EPFO & ESIC Registration** — Provident Fund and Employee State Insurance compliance\n9. **DG Set Standing Permission** — Permission for diesel generators ≥ 100 KVA\n\nCheck out the **Post Industry Establishment** section for stage-wise compliance.",
            suggestions: [
              "What is Consent to Operate (CTO)?",
              "How to get DISH Factory License?",
              "What is Final Fire NOC?"
            ]
          };
        }

        // 6. Pollution / MPCB CTE & CTO
        if (q.includes('mpcb') || q.includes('cte') || q.includes('cto') || q.includes('pollution') || q.includes('consent')) {
          return {
            text: "### 🧪 MPCB Pollution Consents (CTE vs CTO)\n\n- **Consent to Establish (CTE):** Required prior to factory civil works. Requires detailed Environmental Management Plan (EMP), ETP/STP design, water balance diagram, and hazardous waste disposal plan.\n- **Consent to Operate (CTO):** Required after construction but before commencing production. Granted only after inspecting that the constructed ETP/STP matches the sanctioned CTE.\n\n**Validity Periods:**\n- Red Category: 5 Years\n- Orange Category: 5 Years\n- Green Category: 10 Years\n- White Category: Exempted (Self-declaration)\n\n⚠️ **Important:** Running commercial production on a CTE alone without a CTO attracts penalties under Water Act Sec 43/44.",
            suggestions: [
              "Orange Category documents",
              "What is CETP Membership?",
              "What is CHWTSDF membership?"

          };

        // 7. Fire NOC

          return {
            text: "### 🚒 Fire Department Clearances\n\n1. **Provisional Fire NOC:** Issued during building plan approval stage based on architectural drawings, driveway turning radius (≥ 6m), underground water static tank capacity (> 100,000L), and hydrant placement.\n2. **Final Fire NOC:** Issued after building completion following an actual pressure test of wet risers, automatic sprinklers, smoke alarms, and emergency exit signage.\n\n**Issuing Authority:** MIDC Fire Services / Directorate of Maharashtra Fire Services.\n**SLA Timeline:** 15 Working Days.",
            suggestions: [
              "What is Provisional Fire NOC?",
              "What is Final Fire NOC?",
              "What is Building Completion Certificate?"
            ]
          };
        }

        // 8. Industry Categories
        if (q.includes('red category') || q.includes('orange category') || q.includes('green category') || q.includes('white category') || q.includes('category') || q.includes('cpcb')) {
          return {
            text: "### 💼 CPCB Industrial Categorization in Maharashtra\n\n- 🔴 **Red Category (Score ≥ 60):** High pollution potential (Petrochemicals, Electroplating, Tannery, Heavy Bulk Drugs, Pulp & Paper). Requires Full CTE + CTO with continuous online effluent/emission monitoring (OCEMS) and mandatory Zero Liquid Discharge (ZLD) where applicable.\n- 🟠 **Orange Category (Score 41-59):** Medium pollution (Automotive components, Pharmaceuticals, Textiles, Food processing). Requires CTE + CTO with ETP/STP and air pollution scrubbing.\n- 🟢 **Green Category (Score 21-40):** Low pollution (Garments, Electrical assembly, Solar modules). Expedited consent, acknowledgment receipt may suffice at building plan stage.\n- ⚪ **White Category (Score ≤ 20):** Non-polluting (IT & Software, dry warehousing, assembly without chemicals). Exempt from MPCB consent; simple online self-declaration applies.\n\nYour active project (`" + project.name + "`) is registered as **" + (project.category || 'Orange') + " Category**.",
            suggestions: [
              "What documents for Red Category?",
              "What documents for Orange Category?",
              "Tell me about Food / FSSAI rules",
              "Tell me about Pharma Drug License"
            ]
          };
        }

        // 9. AI Document Verification Pipeline
        if (q.includes('ai verification') || q.includes('ocr') || q.includes('verification pipeline') || q.includes('confidence score') || q.includes('how does ai verify')) {
          return {
            text: "### 🤖 7-Stage Autonomous AI Verification Engine\n\nWhen you upload a statutory drawing or permit, the system executes this 7-stage workflow:\n\n1. **Upload & Ingestion:** Accepts PDF, DWG, PNG, or TIFF drawings.\n2. **AI Classification:** Neural classifier labels text into strictly one of **12 statutory types** (`building_plan`, `drainage_plan`, `fire_noc`, `water_connection`, `cetp_membership`, `power_noc`, `plinth_completion`, `bcc_oc`, `factory_license`, `pcb_consent`, `site_plan`, `other`).\n3. **OCR Metadata Extraction:** Extracts 6 standard fields: `document_number`, `issue_date`, `expiry_date`, `authority_name`, `plot_number`, `area_sqft`.\n4. **Field Validation Rules:** Checks date sanity (no future dates, valid validity periods, active certificates).\n5. **Cross-Document Consistency:** Compares extracted Plot No. and Company Name against your Master Application (`" + project.plotNumber + "`, `" + project.name + "`).\n6. **Confidence Scoring:** Aggregates score (0–100%) based on text match quality, complete fields, and consistency.\n7. **Auto-Approve / Flag:** Score ≥ 80% with 0 critical anomalies = **AUTO-APPROVED ✅**. Score < 80% or plot mismatch = **FLAGGED FOR REVIEW ⚠️**.\n\nYou can test this live in the **AI Verification Ops** portal!",
            suggestions: [
              "What are the 12 document types?",
              "What are the 6 extracted fields?",
              "How is plot mismatch detected?"
            ]
          };
        }

        // 10. Fees & SLA
        if (q.includes('fee') || q.includes('cost') || q.includes('price') || q.includes('charges') || q.includes('sla') || q.includes('how long') || q.includes('days')) {
          return {
            text: "### 💰 Statutory Fees & SLA Timeframes (RTS Act Mandated)\n\nUnder the Maharashtra Right to Public Services Act (RTS), statutory authorities must process clearances within fixed SLAs:\n\n- **Building Plan:** 14 Working Days (₹1.50 / sq.ft)\n- **Water Connection:** 10 Working Days (₹15,000 security deposit)\n- **Drainage Plan:** 12 Working Days (₹8,500 scrutiny fee)\n- **Provisional Fire NOC:** 15 Working Days (₹10 / sq.m built-up)\n- **Power Supply NOC:** 10 Working Days (HT tariff deposit)\n- **Plinth Completion:** 7 Working Days (₹5,000 inspection fee)\n- **Occupancy (BCC/OC):** 15 Working Days (₹2.00 / sq.ft)\n\nIf an officer exceeds the SLA timeframe, the file auto-escalates to the District Collector / CEO MIDC.",
            suggestions: [
              "What happens if SLA is missed?",
              "Calculate total fee for 50,000 sq.ft",
              "What is Zero Pendency Index?"
            ]
          };
        }

        // Default Fallback
        return {
          text: "I understand you are inquiring about: **\"" + query + "\"**.\n\nTo ensure complete compliance under Maharashtra industrial bye-laws:\n1. **For statutory drawings**, verify that your plot number matches `" + project.plotNumber + "` and the CAD layout complies with MIDC DCR standards.\n2. **For environmental permissions**, confirm whether your process requires CTE/CTO under the " + (project.category || 'Orange') + " category.\n3. **For time-critical clearances**, check your file under the **Public Transparency Portal** to monitor officer SLA countdowns.\n\nWould you like me to explain any specific clearance or document requirement?",
          suggestions: [
            "What are the 8 Major Permissions?",
            "Explain Pre vs Post Establishment",
            "How does AI Document Verification work?",
            "Show active application status"
          ]
        };
      }

function downloadRenewalCalendar(documents) {
  let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//NiyamSetu//Statutory Renewal Sentinel//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";
  documents.forEach(doc => {
    const dClean = doc.expiryDate.replace(/-/g, '');
    icsContent += `BEGIN:VEVENT\nSUMMARY:RENEWAL DEADLINE: ${doc.documentName}\nDESCRIPTION:Statutory validity milestone for ${doc.documentName} issued by ${doc.authority}. Penalty risk: ${doc.penaltyRisk}\nDTSTART:${dClean}T090000Z\nDTEND:${dClean}T100000Z\nBEGIN:VALARM\nTRIGGER:-P15D\nACTION:DISPLAY\nDESCRIPTION:15-Day Statutory Renewal Reminder: ${doc.documentName}\nEND:VALARM\nEND:VEVENT\n`;
  });
  icsContent += "END:VCALENDAR";

  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.setAttribute('download', 'NiyamSetu_Statutory_Renewal_Calendar_2026.ics');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
